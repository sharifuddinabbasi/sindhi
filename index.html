<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sindhi World Book - سنڌي ورلڊ بڪ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14284B">
    <link rel="apple-touch-icon" href="icon.png">
    <meta property="og:title" content="Sindhi World Book - سنڌي ورلڊ بڪ">
    <meta property="og:description" content="Connect with friends in the traditional colors of Sindh">
    <meta property="og:image" content="icon.png">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ajrak-red: #8B1E24;
            --ajrak-dark-red: #5E1116;
            --normal-brown-text: #654321;
            --ajrak-blue: #14284B;
            --ajrak-dark-blue: #0B162C;
            --normal-blue-text: #0056b3;
            --ajrak-cream: #F4EFE6;
            --ajrak-gold: #D4AF37;
            --text-dark: #1A1A1A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ajrak-cream);
            background-image: 
                radial-gradient(circle at 100% 50%, transparent 20%, rgba(139, 30, 36, 0.04) 21%, rgba(139, 30, 36, 0.04) 34%, transparent 35%, transparent),
                radial-gradient(circle at 0% 50%, transparent 20%, rgba(20, 40, 75, 0.04) 21%, rgba(20, 40, 75, 0.04) 34%, transparent 35%, transparent);
            background-size: 40px 40px;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        html[lang="sd"] body,
        html[lang="sd"] input,
        html[lang="sd"] textarea,
        html[lang="sd"] button,
        html[lang="sd"] label {
            font-family: 'Noto Naskh Arabic', 'MB Latif', 'Segoe UI', Tahoma, sans-serif;
        }

        html[lang="sd"] body {
            font-size: 16px;
        }

        .ajrak-border-strip {
            height: 10px;
            width: 100%;
            background-color: var(--ajrak-dark-blue);
            background-image: 
                linear-gradient(45deg, var(--ajrak-red) 25%, transparent 25%), 
                linear-gradient(-45deg, var(--ajrak-red) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--ajrak-cream) 75%),
                linear-gradient(-45deg, transparent 75%, var(--ajrak-cream) 75%);
            background-size: 14px 14px;
            background-position: 0 0, 0 7px, 7px -7px, -7px 0;
            border-top: 2px solid var(--ajrak-gold);
            border-bottom: 2px solid var(--ajrak-gold);
        }

        header {
            background: linear-gradient(135deg, var(--ajrak-blue) 0%, var(--ajrak-dark-blue) 100%);
            color: var(--ajrak-cream);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25);
        }

        .header-top-row {
            padding: 10px 12px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        header h1 {
            font-size: 24px;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        header h1 span {
            color: var(--ajrak-gold);
            font-size: 20px;
        }

        .fb-icon-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-circle-btn {
            position: relative;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid var(--ajrak-gold);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .icon-circle-btn:hover, .icon-circle-btn.active {
            background-color: var(--ajrak-red);
            transform: scale(1.05);
        }

        .icon-circle-btn svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: #E41E3F;
            color: white;
            font-size: 10px;
            font-weight: bold;
            min-width: 17px;
            height: 17px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 1.5px solid #FFFFFF;
        }

        .header-bottom-row {
            padding: 4px 10px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            direction: ltr;
        }

        .lang-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--ajrak-gold);
            border-radius: 20px;
            padding: 2px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #EAE2D3;
            padding: 3px 8px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .lang-btn.active {
            background-color: var(--ajrak-red);
            color: #FFFFFF;
        }

        .btn-install-app {
            background: linear-gradient(135deg, #1E9E5A 0%, #157A43 100%);
            color: #FFFFFF;
            border: 1px solid #A7F3D0;
            padding: 4px 9px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            transition: 0.2s;
            flex-shrink: 0;
        }

        .btn-install-app:hover {
            transform: scale(1.03);
            background: #17874B;
        }

        .btn-install-app svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .user-dropdown-wrapper {
            position: relative;
            display: flex;
            flex: 1;
            min-width: 0;
        }

        .user-menu-trigger {
            background-color: var(--ajrak-red);
            border: 1px solid var(--ajrak-gold);
            color: #FFFFFF;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12.5px;
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            width: 100%;
            max-width: 100%;
            transition: 0.2s;
        }

        .user-menu-trigger span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-menu-trigger:hover {
            background-color: var(--ajrak-dark-red);
        }

        .user-dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            background-color: #FFFFFF;
            min-width: 175px;
            border-radius: 10px;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
            border: 1.5px solid var(--ajrak-gold);
            overflow: hidden;
            z-index: 300;
            animation: popIn 0.15s ease-out;
        }

        .dropdown-item {
            width: 100%;
            background: none;
            border: none;
            border-bottom: 1px solid #EAE2D3;
            padding: 10px 14px;
            text-align: start;
            font-size: 14px;
            font-weight: 600;
            color: var(--ajrak-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: 0.15s;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background-color: var(--ajrak-cream);
        }

        .dropdown-item.logout-item {
            color: var(--ajrak-red);
        }

        .dropdown-item.logout-item:hover {
            background-color: #FFEBEE;
        }

        .dropdown-count-pill {
            background-color: #28A745;
            color: #FFFFFF;
            font-size: 11px;
            font-weight: bold;
            padding: 1px 7px;
            border-radius: 10px;
        }

        .alert-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 22, 44, 0.72);
            backdrop-filter: blur(2px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .alert-modal-box {
            background: #FFFFFF;
            width: 100%;
            max-width: 345px;
            border-radius: 14px;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.42);
            border: 1.5px solid var(--ajrak-gold);
            overflow: hidden;
            text-align: center;
            animation: bouncePop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bouncePop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .alert-modal-body {
            padding: 22px 18px 18px;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--ajrak-cream) 100%);
        }

        .alert-icon-circle {
            width: 58px;
            height: 58px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFEBEE 0%, #FFCDD2 100%);
            border: 2px solid var(--ajrak-red);
            color: var(--ajrak-red);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(139, 30, 36, 0.22);
        }

        .alert-icon-circle.network-icon {
            background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
            border-color: var(--ajrak-blue);
            color: var(--ajrak-blue);
            box-shadow: 0 4px 12px rgba(20, 40, 75, 0.22);
        }

        .alert-icon-circle.install-icon {
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
            border-color: #1E9E5A;
            color: #157A43;
            box-shadow: 0 4px 12px rgba(30, 158, 90, 0.22);
        }

        .alert-icon-circle svg {
            width: 30px;
            height: 30px;
            fill: currentColor;
        }

        .alert-modal-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--ajrak-red);
            margin-bottom: 6px;
        }

        .alert-modal-title.blue-title {
            color: var(--ajrak-blue);
        }

        .alert-modal-text {
            font-size: 13.5px;
            color: var(--ajrak-blue);
            line-height: 1.55;
            margin-bottom: 18px;
            font-weight: 500;
            white-space: pre-line;
        }

        .alert-modal-ok-btn {
            background: linear-gradient(135deg, var(--ajrak-blue) 0%, var(--ajrak-dark-blue) 100%);
            color: #FFFFFF;
            border: 1.5px solid var(--ajrak-gold);
            padding: 9px 32px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(20, 40, 75, 0.25);
            transition: 0.2s;
        }

        .alert-modal-ok-btn:hover {
            background: var(--ajrak-red);
            transform: scale(1.04);
        }

        .alert-modal-btn-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .alert-modal-cancel-btn {
            background: #EAE2D3;
            color: var(--ajrak-blue);
            border: 1.5px solid #C8BEB0;
            padding: 9px 22px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .alert-modal-cancel-btn:hover {
            background: #DCD4C6;
            transform: scale(1.03);
        }

        .alert-modal-ok-btn.danger-confirm {
            background: linear-gradient(135deg, var(--ajrak-red) 0%, var(--ajrak-dark-red) 100%);
            border-color: var(--ajrak-gold);
        }

        .alert-modal-ok-btn.danger-confirm:hover {
            background: var(--ajrak-dark-red);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 22, 44, 0.65);
            z-index: 999;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 55px 12px 20px;
            overflow-y: auto;
        }

        .modal-box {
            background: #FFFFFF;
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            border: 1px solid var(--ajrak-gold);
            overflow: hidden;
            animation: popIn 0.18s ease-out;
        }

        @keyframes popIn {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            background-color: var(--ajrak-cream);
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #DCD4C6;
        }

        .modal-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .modal-header h3 {
            color: var(--ajrak-blue);
            font-size: 16px;
        }

        .modal-close {
            background: var(--ajrak-red);
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }

        .modal-body {
            padding: 14px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .chat-friend-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FFFFFF;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid #E5DEC9;
            cursor: pointer;
            transition: 0.15s;
        }

        .chat-friend-row:hover {
            background: var(--ajrak-cream);
            border-color: #25D366;
        }

        .chat-friend-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .chat-friend-meta {
            min-width: 0;
            flex: 1;
        }

        .chat-friend-name {
            font-weight: bold;
            color: var(--ajrak-blue);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-last-preview {
            font-size: 12px;
            color: #667781;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .chat-unread-pill {
            background-color: #25D366;
            color: #FFFFFF;
            font-size: 11px;
            font-weight: bold;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            flex-shrink: 0;
        }

        .wa-chat-wrapper {
            display: flex;
            flex-direction: column;
            height: 410px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #C8BEB0;
        }

        .wa-chat-topbar {
            background-color: #075E54;
            color: #FFFFFF;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wa-back-btn {
            background: none;
            border: none;
            color: #FFFFFF;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 50%;
        }

        .wa-back-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        .wa-chat-topbar-name {
            font-weight: bold;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .wa-messages-area {
            flex: 1;
            background-color: #EFEAE2;
            background-image: radial-gradient(rgba(11, 20, 26, 0.06) 1px, transparent 1px);
            background-size: 16px 16px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .wa-msg-bubble {
            max-width: 78%;
            padding: 7px 10px 5px;
            border-radius: 8px;
            font-size: 13.5px;
            line-height: 1.45;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.13);
        }

        .wa-msg-sent {
            align-self: flex-end;
            background-color: #D9FDD3;
            color: #111B21;
            border-top-right-radius: 0;
        }

        .wa-msg-received {
            align-self: flex-start;
            background-color: #FFFFFF;
            color: #111B21;
            border-top-left-radius: 0;
        }

        .wa-msg-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #667781;
            margin-top: 3px;
            direction: ltr;
        }

        .wa-tick-sent {
            color: #8696A0;
            font-weight: bold;
            letter-spacing: -1px;
        }

        .wa-tick-delivered {
            color: #8696A0;
            font-weight: bold;
            letter-spacing: -1.5px;
        }

        .wa-tick-read {
            color: #1E9E5A;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .wa-input-bar {
            background-color: #F0F2F5;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #DCD4C6;
        }

        .wa-input-bar input {
            flex: 1;
            margin-bottom: 0;
            border-radius: 20px;
            background-color: #FFFFFF;
            border: 1px solid #D1D7DB;
            padding: 9px 14px;
            font-size: 14px;
        }

        .wa-send-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #00A884;
            color: #FFFFFF;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.15s;
        }

        .wa-send-btn:hover {
            background-color: #008F6F;
        }

        .wa-send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .setting-menu-btn {
            width: 100%;
            background: var(--ajrak-cream);
            border: 1px solid #DCD4C6;
            border-radius: 10px;
            padding: 13px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            color: var(--ajrak-blue);
            cursor: pointer;
            transition: 0.2s;
        }

        .setting-menu-btn:hover {
            background: #EAE2D3;
            border-color: var(--ajrak-red);
            transform: translateX(2px);
        }

        .history-item {
            background: var(--ajrak-cream);
            border-inline-start: 4px solid var(--ajrak-blue);
            padding: 9px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .history-item.clickable {
            cursor: pointer;
        }

        .history-item.clickable:hover {
            background: #EAE2D3;
        }

        .privacy-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 11px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border: 1.5px solid;
            transition: 0.2s;
        }

        .privacy-toggle-btn.public {
            background-color: #E8F5E9;
            color: #1B5E20;
            border-color: #28A745;
        }

        .privacy-toggle-btn.private {
            background-color: #FFEBEE;
            color: var(--ajrak-red);
            border-color: var(--ajrak-red);
        }

        .post-privacy-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-inline-start: 6px;
            border: 1px solid;
            vertical-align: middle;
        }

        .post-privacy-badge.public {
            background-color: #E8F5E9;
            color: #1B5E20;
            border-color: #28A745;
        }

        .post-privacy-badge.private {
            background-color: #FFEBEE;
            color: var(--ajrak-red);
            border-color: var(--ajrak-red);
        }

        .post-privacy-badge.clickable {
            cursor: pointer;
            transition: 0.15s;
        }

        .post-privacy-badge.clickable:hover {
            transform: scale(1.05);
        }

        .admin-crown-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            color: #0B162C;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 10px;
            margin-inline-start: 6px;
            border: 1px solid #0B162C;
            vertical-align: middle;
        }

        .blocked-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background-color: #FFEBEE;
            color: #B71C1C;
            border: 1px solid #EF9A9A;
            font-size: 10.5px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 10px;
            margin-inline-start: 5px;
        }

        .admin-panel-card {
            background: var(--ajrak-cream);
            border: 1px solid #DCD4C6;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .profile-card-box {
            background: var(--ajrak-cream);
            border: 1px solid #DCD4C6;

        const DEFAULT_ANNOUNCEMENT_DURATION_MS = 5 * 60 * 1000;
        const ANNOUNCEMENTS_LOCAL_KEY = "sb_admin_announcements_v1";
        const DEFAULT_WELCOME_ANNOUNCEMENT = {
            id: "default_welcome_sindhi_world_book",
            text: "Welcome to Sindhi World Book — Connect with friends in the traditional colors of Sindh!",
            image: null,
            authorName: "Admin",
            durationMs: DEFAULT_ANNOUNCEMENT_DURATION_MS,
            isDefaultWelcome: true
        };
        let activeAnnouncementsList = [];
        let announcementsHistoryList = [];
        let announcementTimerInterval = null;
        let unsubscribeAnnouncements = null;

        function formatRemainingClock(remMs) {
            const remSec = Math.max(0, Math.ceil(remMs / 1000));
            const hrs = Math.floor(remSec / 3600);
            const mins = Math.floor((remSec % 3600) / 60);
            const secs = String(remSec % 60).padStart(2, '0');
            return hrs > 0
                ? `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${secs}`
                : `${String(mins).padStart(2, '0')}:${secs}`;
        }

        function loadLocalAnnouncementsList() {
            try {
                const raw = localStorage.getItem(ANNOUNCEMENTS_LOCAL_KEY);
                const arr = raw ? JSON.parse(raw) : [];
                return Array.isArray(arr) ? arr : [];
            } catch (e) {
                return [];
            }
        }

        function saveLocalAnnouncementsList(list) {
            try {
                const clean = (list || []).map(item => ({
                    id: item.id,
                    postMirrorId: item.postMirrorId || null,
                    text: item.text || "",
                    image: item.image || null,
                    imageFileId: item.imageFileId || null,
                    driveIndex: item.driveIndex ?? null,
                    authorId: item.authorId || null,
                    authorName: item.authorName || "Admin",
                    durationMs: item.durationMs || DEFAULT_ANNOUNCEMENT_DURATION_MS,
                    createdAtMs: item.createdAtMs || Date.now(),
                    dateTimeText: item.dateTimeText || "",
                    activeCreatedAtMs: item.activeCreatedAtMs || item.createdAtMs || Date.now(),
                    activeExpiresAtMs: item.activeExpiresAtMs || ((item.createdAtMs || Date.now()) + (item.durationMs || DEFAULT_ANNOUNCEMENT_DURATION_MS))
                }));
                localStorage.setItem(ANNOUNCEMENTS_LOCAL_KEY, JSON.stringify(clean));
            } catch (e) {}
        }

        function mergeAnnouncementsIntoHistory(incomingList) {
            const byId = new Map();
            function putItem(item) {
                if (!item || !item.id) return;
                const existing = byId.get(item.id) || {};
                byId.set(item.id, {
                    ...existing,
                    ...item,
                    createdAtMs: existing.createdAtMs || item.createdAtMs || Date.now(),
                    dateTimeText: existing.dateTimeText || item.dateTimeText || formatDateTime12h(existing.createdAtMs || item.createdAtMs || Date.now())
                });
            }
            loadLocalAnnouncementsList().forEach(putItem);
            announcementsHistoryList.forEach(putItem);
            (incomingList || []).forEach(putItem);

            const merged = Array.from(byId.values()).sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));
            announcementsHistoryList = merged;
            saveLocalAnnouncementsList(merged);

            activeAnnouncementsList = [...merged].sort((a, b) => (b.activeCreatedAtMs || b.createdAtMs || 0) - (a.activeCreatedAtMs || a.createdAtMs || 0));
            renderActiveAnnouncementBanner();
            if (isAdminUser() && !document.getElementById('popup-announcement')?.classList.contains('hidden')) {
                renderAdminAnnouncementsHistoryList();
            }
        }

        function ensureDefaultWelcomeAnnouncementForUser() {
            if (!currentUserObj || !currentUserObj.uid) return;
            const userKey = `sb_welcome_start_${currentUserObj.uid}`;
            let startMs = Number(localStorage.getItem(userKey) || 0);
            if (!startMs) {
                startMs = Date.now();
                localStorage.setItem(userKey, String(startMs));
            }
            const remaining = (startMs + DEFAULT_ANNOUNCEMENT_DURATION_MS) - Date.now();
            if (remaining > 0 && activeAnnouncementsList.length === 0) {
                activeAnnouncementsList = [{
                    ...DEFAULT_WELCOME_ANNOUNCEMENT,
                    createdAtMs: startMs,
                    activeCreatedAtMs: startMs,
                    expiresAtMs: startMs + DEFAULT_ANNOUNCEMENT_DURATION_MS,
                    activeExpiresAtMs: startMs + DEFAULT_ANNOUNCEMENT_DURATION_MS
                }];
            }
            renderActiveAnnouncementBanner();
            if (!announcementTimerInterval) {
                announcementTimerInterval = setInterval(() => {
                    renderActiveAnnouncementBanner();
                    if (isAdminUser() && !document.getElementById('popup-announcement')?.classList.contains('hidden') && !document.activeElement?.id?.startsWith('repost-hhmm-')) {
                        renderAdminAnnouncementsHistoryList();
                    }
                }, 1000);
            }
        }

        function parseHhMmToMs(rawVal) {
            const clean = String(rawVal || '').trim();
            if (!clean) return DEFAULT_ANNOUNCEMENT_DURATION_MS;
            const parts = clean.split(':');
            if (parts.length === 2) {
                const hh = parseInt(parts[0], 10);
                const mm = parseInt(parts[1], 10);
                if (!isNaN(hh) && !isNaN(mm) && hh >= 0 && mm >= 0 && (hh > 0 || mm > 0)) {
                    return ((hh * 60) + mm) * 60 * 1000;
                }
            } else {
                const minsOnly = parseInt(clean, 10);
                if (!isNaN(minsOnly) && minsOnly > 0) {
                    return minsOnly * 60 * 1000;
                }
            }
            return DEFAULT_ANNOUNCEMENT_DURATION_MS;
        }

        function closeAnnouncementPopupNow() {
            const pAnn = document.getElementById('popup-announcement');
            if (pAnn) pAnn.classList.add('hidden');
            const overlay = document.getElementById('popup-overlay');
            if (overlay) overlay.classList.add('hidden');
        }

        window.updateAnnouncementPhotoLabel = function() {
            const t = translations[currentLang];
            const inp = document.getElementById('announcement-image');
            const lbl = document.getElementById('announcement-photo-label-text');
            if (!inp || !lbl) return;
            lbl.innerText = (inp.files && inp.files.length > 0) ? t.photoSelected : t.addPhoto;
        };

        window.createAnnouncement = async function() {
            const t = translations[currentLang];
            if (!isAdminUser()) return;
            if (!navigator.onLine) {
                showCustomAlert(t.noInternetTitle, t.noInternetDesc, t.alertOkBtn, "network");
                return;
            }
            const textEl = document.getElementById('announcement-text');
            const imgInput = document.getElementById('announcement-image');
            const durInput = document.getElementById('announcement-duration-hhmm');
            const btn = document.getElementById('announcement-submit-btn');
            const text = (textEl?.value || '').trim();
            const file = imgInput?.files?.[0] || null;
            const durationMs = parseHhMmToMs(durInput?.value);

            if (!text && !file) {
                showCustomAlert(t.noticeTitle, t.alertEmptyPost, t.alertOkBtn, "error");
                return;
            }

            const abusivePostWords = findAbusiveContent(text);
            if (abusivePostWords.length > 0) {
                showCustomAlert(t.noticeTitle, buildAbusivePostAlertText(abusivePostWords), t.alertOkBtn, "error");
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerText = file ? t.uploadingPhoto : t.posting;
            }

            async function finishAndCloseAnnouncement(annPayload) {
                mergeAnnouncementsIntoHistory([annPayload]);
                if (currentUserObj && currentUserObj.uid) {
                    const cleanLive = {
                        id: annPayload.id,
                        postMirrorId: annPayload.postMirrorId || null,
                        text: annPayload.text || "",
                        image: annPayload.image || null,
                        durationMs: annPayload.durationMs || DEFAULT_ANNOUNCEMENT_DURATION_MS,
                        createdAtMs: annPayload.createdAtMs || Date.now(),
                        dateTimeText: annPayload.dateTimeText || "",
                        activeCreatedAtMs: annPayload.activeCreatedAtMs || annPayload.createdAtMs || Date.now(),
                        activeExpiresAtMs: annPayload.activeExpiresAtMs || annPayload.expiresAtMs || ((annPayload.createdAtMs || Date.now()) + (annPayload.durationMs || DEFAULT_ANNOUNCEMENT_DURATION_MS)),
                        expiresAtMs: annPayload.activeExpiresAtMs || annPayload.expiresAtMs || ((annPayload.createdAtMs || Date.now()) + (annPayload.durationMs || DEFAULT_ANNOUNCEMENT_DURATION_MS))
                    };
                    updateDoc(doc(db, "users", currentUserObj.uid), { liveAnnouncement: cleanLive }).catch(() => {});
                }
                if (textEl) textEl.value = '';
                if (imgInput) imgInput.value = '';
                updateAnnouncementPhotoLabel();
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = translations[currentLang].btnPost;
                }

            async function saveAnnouncementDoc(imgUrl, fileId, driveIdx) {
                const nowMs = Date.now();
                const uniqueLocalId = "ann_" + nowMs + "_" + Math.random().toString(36).slice(2, 7);
                const expiresAtMs = nowMs + durationMs;
                const dateTimeText = formatDateTime12h(nowMs);
                const payload = {
                    text: text,
                    image: imgUrl || null,
                    imageFileId: fileId || null,
                    driveIndex: driveIdx ?? null,
                    authorId: currentUserObj?.uid || null,
                    authorName: currentUserObj?.name || "Admin",
                    durationMs: durationMs,
                    dateTimeText: dateTimeText,
                    activeCreatedAtMs: nowMs,
                    activeExpiresAtMs: expiresAtMs,
                    expiresAtMs: expiresAtMs,
                    createdAtMs: nowMs,
                    createdAt: serverTimestamp()
                };

                await finishAndCloseAnnouncement({ id: uniqueLocalId, postMirrorId: null, ...payload });

                let fsDocId = null;
                try {
                    const docRef = await addDoc(collection(db, "announcements"), payload);
                    fsDocId = docRef.id;
                } catch (fsErr) {
                    console.log("Announcement collection write fallback:", fsErr);
                }
                try {
                    const postAnnRef = await addDoc(collection(db, "posts"), {
                        isAnnouncement: true,
                        announcementDocId: fsDocId || uniqueLocalId,
                        authorId: currentUserObj?.uid || "admin",
                        authorName: currentUserObj?.name || "Admin",
                        text: text,
                        image: imgUrl || null,
                        imageFileId: fileId || null,
                        driveIndex: driveIdx ?? null,
                        privacy: "public",
                        durationMs: durationMs,
                        dateTimeText: dateTimeText,
                        activeCreatedAtMs: nowMs,
                        activeExpiresAtMs: expiresAtMs,
                        expiresAtMs: expiresAtMs,
                        createdAtMs: nowMs,
                        createdAt: serverTimestamp()
                    });
                    const entry = announcementsHistoryList.find(a => a.id === uniqueLocalId);
                    if (entry) {
                        entry.postMirrorId = postAnnRef.id;
                        if (fsDocId) entry.firestoreAnnId = fsDocId;
                        saveLocalAnnouncementsList(announcementsHistoryList);
                    }
                } catch (postErr) {
                    console.log("Announcement posts mirror error:", postErr);
                }
            }

            try {
                if (file) {
                    compressImage(file, async (compressedData) => {
                        try {
                            const upRes = await uploadToAvailableDrive(compressedData, "ann_" + Date.now() + ".jpg");
                            await saveAnnouncementDoc(upRes.url, upRes.fileId, upRes.driveIndex);
                        } catch (err) {
                            if (btn) {
                                btn.disabled = false;
                                btn.innerText = translations[currentLang].btnPost;
                            }
                            showCustomAlert(t.postPhotoErrTitle, t.postPhotoErrDesc, t.alertOkBtn, "error");
                        }
                    });
                } else {
                    await saveAnnouncementDoc(null, null, null);
                }
            } catch (e) {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = translations[currentLang].btnPost;
                }
                showCustomAlert(t.noticeTitle, e.message || "Error", t.alertOkBtn, "error");
            }
        };

        function formatMsToHhMm(msVal) {
            const totalMin = Math.max(1, Math.round((Number(msVal) || DEFAULT_ANNOUNCEMENT_DURATION_MS) / 60000));
            const hh = Math.floor(totalMin / 60);
            const mm = totalMin % 60;
            return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
        }

        function getFullPostRemainingMs(postObj) {
            if (!postObj || !postObj.isFullPostAnnouncement) return 0;
            const nowMs = Date.now();
            const durMs = typeof postObj.fullPostDurationMs === 'number' && postObj.fullPostDurationMs > 0
                ? postObj.fullPostDurationMs
                : (typeof postObj.durationMs === 'number' && postObj.durationMs > 0
                    ? postObj.durationMs
                    : DEFAULT_ANNOUNCEMENT_DURATION_MS);
            const uid = currentUserObj && currentUserObj.uid ? currentUserObj.uid : "guest";
            const fKey = `sb_fpost_uwin_${uid}_${postObj.id || "fpost"}`;
            let userWin = null;
            try {
                const rawWin = localStorage.getItem(fKey);
                if (rawWin) userWin = JSON.parse(rawWin);
            } catch (e) {}

            if (userWin && typeof userWin.expiresAtMs === 'number') {
                return Math.max(0, userWin.expiresAtMs - nowMs);
            }

            const newWin = {
                startMs: nowMs,
                expiresAtMs: nowMs + durMs
            };
            try {
                localStorage.setItem(fKey, JSON.stringify(newWin));
            } catch (e) {}

            return Math.max(0, newWin.expiresAtMs - nowMs);
        }

        function getAnnouncementRemainingMs(annObj) {
            if (!annObj) return 0;
            const nowMs = Date.now();
            const createdMs = typeof annObj.activeCreatedAtMs === 'number'
                ? annObj.activeCreatedAtMs
                : (typeof annObj.createdAtMs === 'number' ? annObj.createdAtMs : 0);
            const durMs = typeof annObj.durationMs === 'number' && annObj.durationMs > 0
                ? annObj.durationMs
                : DEFAULT_ANNOUNCEMENT_DURATION_MS;
            const globalExpiresAt = typeof annObj.activeExpiresAtMs === 'number'
                ? annObj.activeExpiresAtMs
                : (typeof annObj.expiresAtMs === 'number' ? annObj.expiresAtMs : (createdMs + durMs));

            const uid = currentUserObj && currentUserObj.uid ? currentUserObj.uid : "guest";
            const annKey = `sb_ann_uwin_${uid}_${annObj.id || "ann"}_${createdMs}`;
            let userWin = null;
            try {
                const rawWin = localStorage.getItem(annKey);
                if (rawWin) userWin = JSON.parse(rawWin);
            } catch (e) {}

            if (userWin && typeof userWin.expiresAtMs === 'number') {
                return Math.max(0, userWin.expiresAtMs - nowMs);
            }

            if (nowMs >= globalExpiresAt) {
                return 0;
            }

            const newWin = {
                startMs: nowMs,
                expiresAtMs: nowMs + durMs
            };
            try {
                localStorage.setItem(annKey, JSON.stringify(newWin));
            } catch (e) {}

            return Math.max(0, newWin.expiresAtMs - nowMs);
        }

        window.addEventListener('load', updateStickyAnnouncementTop);

        function renderActiveAnnouncementBanner() {
            const bannerEl = document.getElementById('announcement-banner-container');
            if (!bannerEl) return;

            const t = translations[currentLang];
            const activeItems = (activeAnnouncementsList || [])
                .map(ann => ({ ann, remMs: getAnnouncementRemainingMs(ann) }))
                .filter(entry => entry.remMs > 0)
                .sort((a, b) => (b.ann.activeCreatedAtMs || b.ann.createdAtMs || 0) - (a.ann.activeCreatedAtMs || a.ann.createdAtMs || 0));

            if (activeItems.length === 0) {
                bannerEl.classList.add('hidden');
                bannerEl.innerHTML = '';

            }

            let cardsHtml = '';
            activeItems.forEach(({ ann, remMs }) => {
                const timerLabel = formatRemainingClock(remMs);
                const textPart = ann.text
                    ? `<div class="announcement-golden-text">${escapeHTML(ann.text)}</div>`
                    : '';
                const imgPart = ann.image
                    ? `<img src="${escapeHTML(ann.image)}" class="announcement-banner-img" alt="Announcement">`
                    : '';

                cardsHtml += `
                    <div class="announcement-banner-card">
                        <div class="ajrak-border-strip"></div>
                        <div class="announcement-banner-body">
                            <div class="announcement-banner-header">
                                <span>${t.announcementBannerTag}</span>
                                <span>${timerLabel}</span>
                            </div>
                            ${textPart}
                            ${imgPart}
                        </div>
                    </div>
                `;

            bannerEl.innerHTML = cardsHtml;
            updateStickyAnnouncementTop();
            bannerEl.classList.remove('hidden');

        function syncAnnouncementFromPosts(postsArr) {
            const annPosts = (postsArr || []).filter(p => p && p.isAnnouncement === true);
            if (annPosts.length > 0) {
                const mapped = annPosts.map(p => ({
                    id: p.announcementDocId || p.id,
                    postMirrorId: p.id,
                    text: p.text || "",
                    image: p.image || null,
                    imageFileId: p.imageFileId || null,
                    driveIndex: p.driveIndex ?? null,
                    authorId: p.authorId || null,
                    authorName: p.authorName || "Admin",
                    durationMs: p.durationMs || DEFAULT_ANNOUNCEMENT_DURATION_MS,
                    createdAtMs: p.createdAtMs || Date.now(),
                    dateTimeText: p.dateTimeText || formatDateTime12h(p.createdAtMs || Date.now()),
                    activeCreatedAtMs: p.activeCreatedAtMs || p.createdAtMs || Date.now(),
                    activeExpiresAtMs: p.activeExpiresAtMs || p.expiresAtMs || ((p.createdAtMs || Date.now()) + (p.durationMs || DEFAULT_ANNOUNCEMENT_DURATION_MS))
                }));
                mergeAnnouncementsIntoHistory(mapped);
            } else {
                renderActiveAnnouncementBanner();
            }
            if (!announcementTimerInterval) {
                announcementTimerInterval = setInterval(() => {
                    renderActiveAnnouncementBanner();
                    if (isAdminUser() && !document.getElementById('popup-announcement')?.classList.contains('hidden') && !document.activeElement?.id?.startsWith('repost-hhmm-')) {
                        renderAdminAnnouncementsHistoryList();
                    }
                }, 1000);
            }
        }

        function listenToAnnouncements() {
            if (unsubscribeAnnouncements) {
                try { unsubscribeAnnouncements(); } catch (e) {}
            }
            announcementsHistoryList = loadLocalAnnouncementsList();
            activeAnnouncementsList = [...announcementsHistoryList].sort((a, b) => (b.activeCreatedAtMs || b.createdAtMs || 0) - (a.activeCreatedAtMs || a.createdAtMs || 0));
            syncAnnouncementFromPosts(latestDocs);
            const q = query(collection(db, "announcements"), orderBy("createdAtMs", "asc"));
            unsubscribeAnnouncements = onSnapshot(q, (snapshot) => {
                const docsArr = [];
                snapshot.forEach((docSnap) => {
                    docsArr.push({ id: docSnap.id, ...docSnap.data() });
                });
                if (docsArr.length > 0) {
                    mergeAnnouncementsIntoHistory(docsArr);
                }
            }, () => {
                syncAnnouncementFromPosts(latestDocs);
            });
        }

        let customConfirmResolver = null;

        window.showCustomAlert = function(title, desc, btnLabel, type = "error") {
            const t = translations[currentLang];
            const iconBox = document.getElementById('custom-alert-icon-box');
            const titleEl = document.getElementById('custom-alert-title');
            const okBtn = document.getElementById('custom-alert-btn');
            const cancelBtn = document.getElementById('custom-alert-cancel-btn');

            customConfirmResolver = null;
            cancelBtn.classList.add('hidden');
            okBtn.classList.remove('danger-confirm');
            iconBox.className = "alert-icon-circle";
            titleEl.className = "alert-modal-title";

            if (type === "network") {
                iconBox.classList.add("network-icon");
                titleEl.classList.add("blue-title");
                iconBox.innerHTML = ICON_WIFI_OFF;
            } else if (type === "install") {
                iconBox.classList.add("install-icon");
                titleEl.classList.add("blue-title");
                iconBox.innerHTML = ICON_INSTALL_PHONE;
            } else if (type === "info") {
                titleEl.classList.add("blue-title");
                iconBox.innerHTML = ICON_ALERT_EXCLAMATION;
            } else {
                iconBox.innerHTML = ICON_ALERT_EXCLAMATION;
            }

            titleEl.innerText = title || t.noticeTitle;
            document.getElementById('custom-alert-desc').innerText = desc || '';
            okBtn.innerText = btnLabel || t.alertOkBtn;
            document.getElementById('custom-alert-overlay').classList.remove('hidden');
        };

        window.showCustomConfirm = function(title, desc, confirmLabel, isDanger = true) {
            const t = translations[currentLang];
            const iconBox = document.getElementById('custom-alert-icon-box');
            const titleEl = document.getElementById('custom-alert-title');
            const okBtn = document.getElementById('custom-alert-btn');
            const cancelBtn = document.getElementById('custom-alert-cancel-btn');

            iconBox.className = "alert-icon-circle";
            titleEl.className = "alert-modal-title";
            iconBox.innerHTML = ICON_ALERT_EXCLAMATION;

            titleEl.innerText = title || t.confirmTitle;
            document.getElementById('custom-alert-desc').innerText = desc || '';
            cancelBtn.innerText = t.cancel;
            cancelBtn.classList.remove('hidden');

            okBtn.innerText = confirmLabel || t.alertOkBtn;
            if (isDanger) {
                okBtn.classList.add('danger-confirm');
            } else {
                okBtn.classList.remove('danger-confirm');
            }

            document.getElementById('custom-alert-overlay').classList.remove('hidden');

            return new Promise((resolve) => {
                customConfirmResolver = resolve;
            });
        };

        window.resolveCustomConfirm = function(result) {
            document.getElementById('custom-alert-overlay').classList.add('hidden');
            if (typeof customConfirmResolver === 'function') {
                const resolver = customConfirmResolver;
                customConfirmResolver = null;
                resolver(Boolean(result));

        async function sendStyledVerificationEmail(emailStr, nameStr, uidStr) {
            const baseUrl = window.location.origin + window.location.pathname;
            let verifyUrl = "";
            try {
                const verDoc = await addDoc(collection(db, "email_verifications"), {
                    uid: uidStr || null,
                    email: (emailStr || "").trim().toLowerCase(),
                    name: nameStr || "User",
                    verified: false,
                    expiresAt: Date.now() + (24 * 60 * 60 * 1000)
                });
                verifyUrl = `${baseUrl}?verifyToken=${encodeURIComponent(verDoc.id)}`;
            } catch (fsErr) {
                const pack = btoa(unescape(encodeURIComponent(JSON.stringify({
                    uid: uidStr || "",
                    email: (emailStr || "").trim().toLowerCase(),
                    name: nameStr || "User",
                    exp: Date.now() + (24 * 60 * 60 * 1000)
                }))));
                verifyUrl = `${baseUrl}?verifyEmail=${encodeURIComponent(pack)}`;
            }

            const response = await fetch(DRIVE_URLS[0], {
                method: "POST",
                redirect: "follow",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "send_verification_email",
                    email: emailStr,
                    name: nameStr || "User",
                    verifyUrl: verifyUrl
                })
            });

            const resText = await response.text();
            let resJson = null;
            try {
                resJson = JSON.parse(resText);
            } catch (parseErr) {
                throw new Error("Apps Script returned non-JSON response. Please re-deploy Code.gs as a New Version.");
            }
            if (!resJson || resJson.status !== "sent") {
                throw new Error((resJson && resJson.message) ? resJson.message : "Failed to send verification email from Apps Script.");
            }
        }

        async function handleCustomEmailVerifyToken() {
            const t = translations[currentLang];
            if (customVerifyPayload) {
                document.getElementById('auth-section').classList.remove('hidden');
                switchTab('login');
                try {
                    const decoded = JSON.parse(decodeURIComponent(escape(atob(customVerifyPayload))));
                    if (!decoded || !decoded.exp || Date.now() > decoded.exp) {
                        showMessage(t.invalidResetLink, true);
                        return true;
                    }
                    await markUserAsCustomVerified(decoded.uid, decoded.email);
                    window.history.replaceState({}, document.title, window.location.pathname);
                    showMessage(
                        currentLang === 'sd'
                            ? "توهان جي اي ميل ڪاميابيءَ سان تصديق ٿي وئي آهي! هاڻي لاگ ان ڪريو."
                            : "Your email has been verified successfully! You can now log in.",
                        false
                    );
                } catch (e) {
                    showMessage(t.invalidResetLink, true);
                }
                return true;
            }

            if (!customVerifyToken) return false;
            document.getElementById('auth-section').classList.remove('hidden');
            switchTab('login');
            try {
                const verRef = doc(db, "email_verifications", customVerifyToken);
                const verSnap = await getDoc(verRef);
                if (!verSnap.exists()) {
                    showMessage(t.invalidResetLink, true);
                    return true;
                }
                const vData = verSnap.data();
                if (Date.now() > (vData.expiresAt || 0)) {
                    showMessage(t.invalidResetLink, true);
                    return true;
                }
                await updateDoc(verRef, { verified: true }).catch(() => {});
                await markUserAsCustomVerified(vData.uid, vData.email);
                window.history.replaceState({}, document.title, window.location.pathname);
                showMessage(
                    currentLang === 'sd'
                        ? "توهان جي اي ميل ڪاميابيءَ سان تصديق ٿي وئي آهي! هاڻي لاگ ان ڪريو."
                        : "Your email has been verified successfully! You can now log in.",
                    false
                );
            } catch (e) {
                showMessage(t.invalidResetLink, true);
            }
            return true;
        }

        window.confirmCustomEmailPasswordReset = async function() {
            const t = translations[currentLang];
            if (!navigator.onLine) {
                showCustomAlert(t.noInternetTitle, t.noInternetDesc, t.alertOkBtn, "network");
                return;
            }
            const newPass = document.getElementById('email-reset-new-pass').value;
            const repeatPass = document.getElementById('email-reset-repeat-pass').value;
            const statusEl = document.getElementById('email-reset-status');
            const btn = document.getElementById('btn-confirm-email-reset');

            statusEl.classList.add('hidden');

            if (newPass.length < 6) {
                statusEl.innerText = t.passShortError;
                statusEl.className = "status-msg status-error";
                statusEl.classList.remove('hidden');
                return;
            }
            if (newPass !== repeatPass) {
                statusEl.innerText = t.passMismatchError;
                statusEl.className = "status-msg status-error";
                statusEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            try {
                if (!resetTokenData || !resetTokenData.currentKey) {
                    throw new Error(t.invalidResetLink);
                }

                const oldPass = atob(resetTokenData.currentKey);
                const cred = await signInWithEmailAndPassword(auth, resetTokenData.email, oldPass);
                await updatePassword(cred.user, newPass);

                await updateDoc(doc(db, "password_resets", customResetToken), {
                    used: true
                });
                await updateDoc(doc(db, "users", resetTokenData.uid), {
                    passSync: btoa(newPass)
                });

                statusEl.innerText = t.resetPassDoneSuccess;
                statusEl.className = "status-msg status-success";
                statusEl.classList.remove('hidden');
                document.getElementById('email-reset-new-pass').value = '';
                document.getElementById('email-reset-repeat-pass').value = '';
            } catch (err) {
                if (isNetworkError(err)) {
                    showCustomAlert(t.noInternetTitle, t.noInternetDesc, t.alertOkBtn, "network");
                } else {
                    statusEl.innerText = err.message;
                    statusEl.className = "status-msg status-error";
                    statusEl.classList.remove('hidden');
                }
                btn.disabled = false;
            }

        function escapeHTML(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")

        async function uploadToAvailableDrive(compressedData, fileName) {
            let lastError = "No Google Drive configured.";

            for (let i = 0; i < DRIVE_URLS.length; i++) {
                const driveUrl = DRIVE_URLS[i];
                if (!driveUrl) continue;

                try {
                    const response = await fetch(driveUrl, {
                        method: "POST",
                        redirect: "follow",
                        headers: {
                            "Content-Type": "text/plain;charset=utf-8"
                        },
                        body: JSON.stringify({
                            base64: compressedData,
                            mimeType: "image/jpeg",
                            fileName: fileName
                        })
                    });

                    const responseText = await response.text();
                    const result = JSON.parse(responseText);

                    if (result.status === "success") {
                        return {
                            url: result.url,
                            fileId: result.fileId,
                            driveIndex: i
                        };
                    } else {
                        lastError = result.message || "Drive upload error";
                    }
                } catch (err) {
                    lastError = err.message;
                }
            }

            throw new Error(lastError);
        }

            const btn = document.getElementById('btn-resend-verify-email');
            if (!btn) return;
            const t = translations[currentLang];
            const emailStr = pendingUnverifiedCred?.email || document.getElementById('login-email')?.value || '';
            const lastSent = getVerificationSentTimestamp(emailStr);
            const elapsedMs = lastSent ? (Date.now() - lastSent) : 60000;
            const remainingSec = Math.max(0, Math.ceil((60000 - elapsedMs) / 1000));

            if (remainingSec > 0) {
                const mins = String(Math.floor(remainingSec / 60)).padStart(2, '0');
                const secs = String(remainingSec % 60).padStart(2, '0');
                btn.disabled = true;
                btn.innerText = `${t.resendVerifyWaitPrefix} (${mins}:${secs})`;
            } else {
                btn.disabled = false;
                btn.innerText = t.resendVerifyBtn;
            }
        }

            const t = translations[currentLang];
            const msgBox = document.getElementById('auth-message');
            msgBox.innerHTML = `

            updateResendVerifyButtonState();

                clearInterval(resendVerifyCountdownTimer);

            resendVerifyCountdownTimer = setInterval(() => {
                const activeBtn = document.getElementById('btn-resend-verify-email');
                if (!activeBtn) {

        window.resendVerificationEmail = async function() {
            const t = translations[currentLang];
            if (!navigator.onLine) {
                showCustomAlert(t.noInternetTitle, t.noInternetDesc, t.alertOkBtn, "network");
                return;
            }
            const emailStr = (pendingUnverifiedCred?.email || document.getElementById('login-email')?.value || '').trim();
            const passwordStr = pendingUnverifiedCred?.password || document.getElementById('login-password')?.value || '';
            const lastSent = getVerificationSentTimestamp(emailStr);

                updateResendVerifyButtonState();
                return;

            if (!emailStr || !passwordStr) {
                showCustomAlert(t.invalidLoginTitle, t.msgLoginEmpty, t.alertOkBtn, "error");
                return;
            }

            const btn = document.getElementById('btn-resend-verify-email');
            if (btn) {
                btn.disabled = true;
                btn.innerText = t.resendVerifySending;
            }

            try {
                const cred = await signInWithEmailAndPassword(auth, emailStr, passwordStr);
                try {
                    await sendStyledVerificationEmail(emailStr, cred.user.displayName || emailStr.split('@')[0], cred.user.uid);
                    recordVerificationSent(emailStr);
                    await signOut(auth);
                    showUnverifiedLoginNotice(t.resendVerifySentOk, emailStr, passwordStr, false);
                } catch (mailErr) {
                    await signOut(auth).catch(() => {});
                    showUnverifiedLoginNotice("Email Error: " + (mailErr.message || "Apps Script error"), emailStr, passwordStr, true);
                }
            } catch (err) {
                if (isNetworkError(err)) {
                    showCustomAlert(t.noInternetTitle, t.noInternetDesc, t.alertOkBtn, "network");
                } else {
                    showUnverifiedLoginNotice(err.message || t.msgNotVerified, emailStr, passwordStr, true);
                }
            }
        };

        function playMessagePopSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.18);
            } catch (e) {}
        }

        function clearAllSystemNotifications() {
            if ("clearAppBadge" in navigator) {
                navigator.clearAppBadge().catch(() => {});
            }
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.ready.then(async (reg) => {
                    try {
                        const notifs = await reg.getNotifications();
                        notifs.forEach((n) => n.close());
                    } catch (e) {}
                    if (reg.active) {
                        reg.active.postMessage({ type: "CLEAR_MSG_BADGE" });
                    }
                }).catch(() => {});
            }
        }

        function updateAppIconBadge(count, latestSenderName = "", latestText = "") {
            if ("setAppBadge" in navigator) {
                if (count > 0) {
                    navigator.setAppBadge(count).catch(() => {});
                } else if ("clearAppBadge" in navigator) {
                    navigator.clearAppBadge().catch(() => {});
                }
            }
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.ready.then((reg) => {
                    if (count > 0 && "Notification" in window && Notification.permission === "granted") {
                        if (reg.active) {
                            reg.active.postMessage({
                                type: "NEW_MSG_BADGE",
                                count: count,
                                sender: latestSenderName || "Sindhi World Book",
                                text: latestText || (count + " new message(s)")
                            });
                        }
                    } else if (count === 0) {
                        clearAllSystemNotifications();
                    }
                }).catch(() => {});
            }
        }

        function listenToMessages() {
            if (!currentUserObj || !currentUserObj.uid) return;
            if (unsubscribeMessages) {
                try { unsubscribeMessages(); } catch (e) {}
            }
            const q = query(
                collection(db, "messages"),
                where("participants", "array-contains", currentUserObj.uid)
            );
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                allMyMessages = [];
                snapshot.forEach((docSnap) => {
                    allMyMessages.push({ id: docSnap.id, ...docSnap.data() });
                });
                allMyMessages.sort((a, b) => (a.clientTime || 0) - (b.clientTime || 0));

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added" || change.type === "modified") {
                        const m = change.doc.data();
                        if (m.receiverId === currentUserObj.uid && m.delivered !== true) {
                            updateDoc(doc(db, "messages", change.doc.id), { delivered: true })
                                .catch((err) => console.error("Delivered update failed:", err));
                        }
                    }
                });

                const unreadMsgs = allMyMessages.filter(
                    m => m.receiverId === currentUserObj.uid && !m.read
                );
                const unreadCount = unreadMsgs.length;

                const isNewIncoming = unreadCount > previousUnreadCount;
                if (isNewIncoming) {
                    playMessagePopSound();
                }
                previousUnreadCount = unreadCount;

                const msgBadge = document.getElementById('msg-badge');
                if (unreadCount > 0) {
                    msgBadge.innerText = unreadCount;
                    msgBadge.classList.remove('hidden');
                } else {
                    msgBadge.classList.add('hidden');
                }
                if (isNewIncoming && unreadMsgs.length > 0) {
                    const lastUnread = unreadMsgs[unreadMsgs.length - 1];
                    const senderObj = allUsersList.find(u => u.uid === lastUnread.senderId);
                    updateAppIconBadge(unreadCount, senderObj ? senderObj.name : "Sindhi World Book", lastUnread.text || "");
                } else if (unreadCount === 0) {
                    updateAppIconBadge(0);
                }

                const popupMsgEl = document.getElementById('popup-messages');
                if (popupMsgEl && !popupMsgEl.classList.contains('hidden')) {
                    if (activeChatFriendUid) {
                        renderActiveChatMessages();
                        markFriendMessagesAsRead(activeChatFriendUid);
                    } else {
                        renderChatFriendsList();
                    }
                }
            });
        }

        async function markFriendMessagesAsRead(friendUid) {
            if (!friendUid || !currentUserObj) return;
            const unreadFromFriend = allMyMessages.filter(
                m => m.senderId === friendUid && m.receiverId === currentUserObj.uid && !m.read
            );
            for (const msg of unreadFromFriend) {
                await updateDoc(doc(db, "messages", msg.id), {
                    delivered: true,
                    read: true
                }).catch(() => {});
            }
            const remainingUnread = allMyMessages.filter(
                m => m.receiverId === currentUserObj.uid && !m.read && m.senderId !== friendUid
            ).length;
            if (remainingUnread === 0) {
                clearAllSystemNotifications();
            }
        }

        window.renderChatFriendsList = function() {
            const t = translations[currentLang];
            const container = document.getElementById('popup-chat-friends-list');
            if (!container) return;
            container.innerHTML = '';

            const chatPartnerIds = new Set(myFriendsList);
            allMyMessages.forEach(m => {
                if (m.senderId && m.senderId !== currentUserObj.uid) chatPartnerIds.add(m.senderId);
                if (m.receiverId && m.receiverId !== currentUserObj.uid) chatPartnerIds.add(m.receiverId);
            });

            const chatUsers = allUsersList.filter(u => chatPartnerIds.has(u.uid));

            if (chatUsers.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#666; font-size:13px; padding:16px;">${t.noFriends}</p>`;
                return;
            }

            const enriched = chatUsers.map(u => {
                const thread = allMyMessages.filter(
                    m => (m.senderId === u.uid && m.receiverId === currentUserObj.uid) ||
                         (m.senderId === currentUserObj.uid && m.receiverId === u.uid)
                );
                const unreadCount = thread.filter(m => m.receiverId === currentUserObj.uid && !m.read).length;
                const lastMsg = thread.length > 0 ? thread[thread.length - 1] : null;
                return {
                    user: u,
                    unreadCount,
                    lastMsg,
                    lastTime: lastMsg ? (lastMsg.clientTime || 0) : 0
                };
            });

            enriched.sort((a, b) => {
                if (b.unreadCount !== a.unreadCount) return b.unreadCount - a.unreadCount;
                return b.lastTime - a.lastTime;
            });

            enriched.forEach(item => {
                const u = item.user;
                const avatarInner = getAvatarHTML(u.photoUrl, u.name);
                const ringCls = getOnlineRingClass(u);
                const onlineRingCls = getOnlineRingClass(u);
                let previewText = t.tapToChat;
                if (item.lastMsg) {
                    const prefix = item.lastMsg.senderId === currentUserObj.uid ? t.youPrefix : "";
                    previewText = escapeHTML(prefix + item.lastMsg.text);
                }

                const badgeHTML = item.unreadCount > 0
                    ? `<span class="chat-unread-pill">${item.unreadCount}</span>`
                    : '';

                container.innerHTML += `
                    <div class="chat-friend-row" onclick="openFriendChat('${u.uid}')">
                        <div class="chat-friend-left">
                            <div class="mini-avatar ${ringCls}">${avatarInner}</div>
                            <div class="chat-friend-meta">
                                <div class="chat-friend-name">${escapeHTML(u.name)}</div>
                                <div class="chat-last-preview">${previewText}</div>
                            </div>
                        </div>
                        ${badgeHTML}
                    </div>
                `;
            });
        };

        function renderActiveChatMessages() {
            const t = translations[currentLang];
            const container = document.getElementById('wa-messages-container');
            if (!container || !activeChatFriendUid) return;

            const thread = allMyMessages.filter(
                m => (m.senderId === activeChatFriendUid && m.receiverId === currentUserObj.uid) ||
                     (m.senderId === currentUserObj.uid && m.receiverId === activeChatFriendUid)
            );

            if (thread.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#54656F; font-size:12.5px; margin:auto; background:rgba(255,255,255,0.85); padding:8px 14px; border-radius:8px;">${t.noChatMessages}</div>`;
                return;
            }

            let html = '';
            thread.forEach(m => {
                const isMine = m.senderId === currentUserObj.uid;
                let tickHTML = '';
                if (isMine) {
                    if (m.read) {
                        tickHTML = `<span class="wa-tick-read">✓✓</span>`;
                    } else if (m.delivered) {
                        tickHTML = `<span class="wa-tick-delivered">✓✓</span>`;
                    } else {
                        tickHTML = `<span class="wa-tick-sent">✓</span>`;
                    }
                }

                html += `
                    <div class="wa-msg-bubble ${isMine ? 'wa-msg-sent' : 'wa-msg-received'}">
                        <div>${escapeHTML(m.text)}</div>
                        <div class="wa-msg-meta">
                            <span>${escapeHTML(m.timeText || '')}</span>
                            ${tickHTML}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        window.sendChatMessage = async function(e) {
            e.preventDefault();
            const t = translations[currentLang];
            if (!navigator.onLine) {
                showCustomAlert(t.noInternetTitle, t.noInternetDesc, t.alertOkBtn, "network");
                return;
            }
            if (!activeChatFriendUid || !currentUserObj) return;

            const input = document.getElementById('wa-chat-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            const now = new Date();
            const timeText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgDocRef = await addDoc(collection(db, "messages"), {
                senderId: currentUserObj.uid,
                receiverId: activeChatFriendUid,
                participants: [currentUserObj.uid, activeChatFriendUid],
                text: text,
                timeText: timeText,
                clientTime: Date.now(),
                delivered: false,
                read: false,
                createdAt: serverTimestamp()
            });

            // Trigger background push notification to receiver even if their app is completely closed
            try {
                if (PUSH_SCRIPT_URL && PUSH_SCRIPT_URL.startsWith("https://")) {
                    const receiverSnap = await getDoc(doc(db, "users", activeChatFriendUid));
                    if (receiverSnap.exists()) {
                        const rData = receiverSnap.data();
                        const rawTokens = rData.lastFcmToken
                            ? [rData.lastFcmToken]
                            : (Array.isArray(rData.fcmTokens) ? rData.fcmTokens.slice(-1) : []);
                        if (rawTokens.length > 0) {
                            fetch(PUSH_SCRIPT_URL, {
                                method: "POST",
                                redirect: "follow",
                                headers: { "Content-Type": "text/plain;charset=utf-8" },
                                body: JSON.stringify({
                                    action: "send_fcm_push",
                                    msgId: msgDocRef.id,
                                    tokens: rawTokens,

        async function notifyPostParticipants(postObj, type, snippet, replyText = "", postStillExists = true) {
            if (!postObj) return;
            const recipients = new Set();

            if (postObj.authorId) {
                recipients.add(postObj.authorId);
            }
            (postObj.likes || []).forEach(uid => recipients.add(uid));
            (postObj.unlikes || []).forEach(uid => recipients.add(uid));
            (postObj.comments || []).forEach(c => {
                if (c.authorId) recipients.add(c.authorId);
            });

            recipients.delete(currentUserObj.uid);

            for (const targetUid of recipients) {
                const isOwnPost = (targetUid === postObj.authorId);
                const targetPostId = postStillExists ? postObj.id : null;
                await createNotification(targetUid, type, targetPostId, snippet, replyText, isOwnPost);
            }
