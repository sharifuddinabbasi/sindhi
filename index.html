                const comments = post.comments || [];
                const isLiked = likes.includes(currentUserObj.uid);
                const isUnliked = unlikes.includes(currentUserObj.uid);
                const isPostOwner = post.authorId === currentUserObj.uid;
                const canManagePost = isPostOwner || isAdminUser();

                let displayAuthorName = post.authorName;
                let authorPhotoUrl = post.authorPhotoUrl || null;
                if (isPostOwner) {
                    displayAuthorName = currentUserObj.name;
                    authorPhotoUrl = currentUserObj.photoUrl || authorPhotoUrl;
                } else {
                    const authorObj = allUsersList.find(u => u.uid === post.authorId);
                    if (authorObj) {
                        displayAuthorName = authorObj.name || post.authorName;
                        authorPhotoUrl = authorObj.photoUrl || authorPhotoUrl;
                    }
                }
                const avatarInner = getAvatarHTML(authorPhotoUrl, displayAuthorName);
                const postAuthorUserObj = isPostOwner ? null : allUsersList.find(u => u.uid === post.authorId);
                const postAuthorRingCls = getOnlineRingClass(postAuthorUserObj);

                let commentsHTML = '';
                comments.forEach((c, idx) => {
                    const isCommentOwner = c.authorId === currentUserObj.uid;
                    const canEditComment = isCommentOwner || isAdminUser();
                    const canDeleteComment = isCommentOwner || isPostOwner || isAdminUser();
                    const cLikes = c.likes || [];
                    const cUnlikes = c.unlikes || [];
                    const isCommentLiked = cLikes.includes(currentUserObj.uid);
                    const isCommentUnliked = cUnlikes.includes(currentUserObj.uid);

                    let cAuthorName = c.author;
                    if (isCommentOwner) {
                        cAuthorName = currentUserObj.name;
                    } else {
                        const cUserObj = allUsersList.find(u => u.uid === c.authorId);
                        if (cUserObj && cUserObj.name) cAuthorName = cUserObj.name;
                    }

                    commentsHTML += `
                        <div class="comment-item">
                            <div class="comment-top">
                                <span class="comment-author">${escapeHTML(cAuthorName)} <small style="font-weight:normal; color:#777;">${c.edited ? t.edited : ''}</small></span>
                                ${(canEditComment || canDeleteComment) ? `
                                    <div class="comment-controls">
                                        ${canEditComment ? `<button class="edit" title="${t.editTitle}" onclick="enableCommentEdit('${postId}', ${idx})">${ICON_EDIT_SVG}</button>` : ''}
                                        ${canDeleteComment ? `<button class="delete" title="${t.deleteTitle}" onclick="deleteComment('${postId}', ${idx})">${ICON_DUSTBIN_SVG}</button>` : ''}
                                    </div>
                                ` : ''}
                            </div>
                            <div id="comment-text-${postId}-${idx}" class="comment-body-text">${escapeHTML(c.text)}</div>
                            ${canEditComment ? `
                                <div id="comment-edit-${postId}-${idx}" class="comment-edit-box hidden">
                                    <input type="text" id="comment-input-edit-${postId}-${idx}" value="${(c.text || '').replace(/"/g, '&quot;')}">
                                    <div style="display:flex; gap:6px; justify-content:flex-end;">
                                        <button class="btn-cancel" onclick="cancelCommentEdit('${postId}', ${idx})">${t.cancel}</button>
                                        <button class="btn-save" onclick="saveCommentEdit('${postId}', ${idx})">${t.saveChanges}</button>
                                    </div>
                                </div>
                            ` : ''}
                            <div class="comment-reactions">
                                <button class="comment-react-btn ${isCommentLiked ? 'active-like' : ''}" title="${t.likeTitle}" onclick="handleCommentLike('${postId}', ${idx})">
                                    ❤️ <span>${cLikes.length}</span>
                                </button>
                                <button class="comment-react-btn ${isCommentUnliked ? 'active-unlike' : ''}" title="${t.unlikeTitle}" onclick="handleCommentUnlike('${postId}', ${idx})">
                                    💔 <span>${cUnlikes.length}</span>
                                </button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div id="post-card-${postId}" class="card">
                        <div class="ajrak-border-strip"></div>
                        <div class="card-body">
                            <div class="post-header">
                                <div class="author-info">
                                    <div class="avatar">${avatarInner}</div>
                                    <div>
                                        <div class="author-name">
                                            ${escapeHTML(displayAuthorName)}
                                            ${(() => {
                                                const authorObj = isPostOwner ? currentUserObj : allUsersList.find(u => u.uid === post.authorId);
                                                const isAuthorAdmin = authorObj && (authorObj.email || '').toLowerCase().trim() === ADMIN_EMAIL;
                                                return isAuthorAdmin ? `<span class="admin-crown-badge">${t.adminBadgeLabel}</span>` : '';
                                            })()}
                                            ${(() => {
                                                const pPriv = post.privacy || 'public';
                                                const pLabel = pPriv === 'private' ? t.postPrivateBtn : t.postPublicBtn;
                                                if (canManagePost) {
                                                    return `<button type="button" class="post-privacy-badge ${pPriv} clickable" onclick="toggleExistingPostPrivacy('${postId}')" title="Change Privacy">${pLabel}</button>`;
                                                }
                                                return `<span class="post-privacy-badge ${pPriv}">${pLabel}</span>`;
                                            })()}
                                        </div>
                                        <div class="post-time">${post.timeText || ''} ${post.edited ? t.edited : ''}</div>
                                    </div>
                                </div>
                                ${canManagePost ? `
                                    <div class="owner-controls">
                                        ${(isAdminUser() && !isPostOwner) ? (() => {
                                            const postAuthorObj = allUsersList.find(u => u.uid === post.authorId);
                                            const isBlockedAuthor = postAuthorObj && postAuthorObj.blocked === true;
                                            return isBlockedAuthor
                                                ? `<button class="btn-sm primary" style="background-color:#1E9E5A; padding:4px 8px; font-size:11px;" onclick="toggleBlockUser('${post.authorId}', false)">${t.unblockUserBtn}</button>`
                                                : `<button class="btn-sm danger" style="padding:4px 8px; font-size:11px;" onclick="toggleBlockUser('${post.authorId}', true)">${t.blockUserBtn}</button>`;
                                        })() : ''}
                                        <button class="control-btn edit" title="${t.editTitle}" onclick="enableEdit('${postId}')">${ICON_EDIT_SVG}</button>
                                        <button class="control-btn delete" title="${t.deleteTitle}" onclick="deletePost('${postId}')">${ICON_DUSTBIN_SVG}</button>
                                    </div>
                                ` : ''}
                            </div>
                            
                            <div id="post-text-display-${postId}" class="post-content ${!post.text ? 'hidden' : ''}">${escapeHTML(post.text || '')}</div>
                            
                            ${canManagePost ? `
                                <div id="edit-box-${postId}" class="edit-box hidden">
                                    <textarea id="edit-input-${postId}">${escapeHTML(post.text || '')}</textarea>
                                    <div class="edit-actions">
                                        <button class="btn-cancel" onclick="cancelEdit('${postId}')">${t.cancel}</button>
                                        <button class="btn-save" onclick="saveEdit('${postId}')">${t.saveChanges}</button>
                                    </div>
                                </div>
                            ` : ''}

                            ${post.image ? `<img src="${post.image}" class="post-image" alt="Post Image" loading="lazy" draggable="false" oncontextmenu="return false;">` : ''}

                            <div class="post-stats">
                                <span>❤️ ${likes.length} ${t.likesCount}</span>
                                <span>💔 ${unlikes.length} ${t.unlikesCount}</span>
                                <span>${comments.length} ${t.commentsCount}</span>
                            </div>

                            <div class="post-actions">
                                ${canInteractWithPost(post) ? `
                                    <button class="action-btn ${isLiked ? 'active-like' : ''}" title="${t.likeTitle}" onclick="handleLike('${postId}', ${isLiked})">
                                        ❤️
                                    </button>
                                    <button class="action-btn ${isUnliked ? 'active-unlike' : ''}" title="${t.unlikeTitle}" onclick="handleUnlike('${postId}', ${isUnliked})">
                                        💔
                                    </button>
                                ` : ''}
                                <button class="action-btn" title="${t.shareTitle}" onclick="sharePost('${postId}')">
                                    ${ICON_SHARE_SVG}
                                    <span class="share-btn-label">${t.shareBtnText}</span>
                                </button>
                            </div>

                            <div class="comments-section">
                                ${commentsHTML}
                                ${canInteractWithPost(post) ? `
                                    <form class="comment-form" onsubmit="addComment(event, '${postId}')">
                                        <input type="text" id="comment-input-${postId}" placeholder="${t.commentPlaceholder}">
                                        <button type="submit">${t.sendBtn}</button>
                                    </form>
                                ` : `
                                    <div style="margin-top:8px; padding:7px 10px; border-radius:8px; background:var(--ajrak-cream); border:1px dashed #C8BEB0; color:var(--ajrak-blue); font-size:12px; font-weight:600; text-align:center;">
                                        ${t.friendOnlyCommentHint.replace(/\{username\}/g, escapeHTML(displayAuthorName))}
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.handleLike = async function(postId, isLiked) {
            const t = translations[currentLang];
            const targetCheckPost = latestDocs.find(p => p.id === postId);
            if (!canInteractWithPost(targetCheckPost)) {
                const aName = targetCheckPost?.authorName || "User";
                showCustomAlert(t.friendOnlyInteractTitle, t.friendOnlyInteractMsg.replace(/\{username\}/g, aName), t.alertOkBtn, "info");
                return;
            }
            const postRef = doc(db, "posts", postId);
            if (isLiked) {
                await updateDoc(postRef, { likes: arrayRemove(currentUserObj.uid) });
            } else {
                await updateDoc(postRef, {
                    likes: arrayUnion(currentUserObj.uid),
                    unlikes: arrayRemove(currentUserObj.uid)
                });
                const targetPost = latestDocs.find(p => p.id === postId);
                if (targetPost) {
                    const snippet = targetPost.text ? targetPost.text.substring(0, 45) : t.photoPostTag;
                    await logActivityHistory('like', postId, snippet);
                    await notifyPostParticipants(targetPost, 'like', snippet, "", true);
                }
            }
        };

        window.handleUnlike = async function(postId, isUnliked) {
            const t = translations[currentLang];
            const targetCheckPost = latestDocs.find(p => p.id === postId);
            if (!canInteractWithPost(targetCheckPost)) {
                const aName = targetCheckPost?.authorName || "User";
                showCustomAlert(t.friendOnlyInteractTitle, t.friendOnlyInteractMsg.replace(/\{username\}/g, aName), t.alertOkBtn, "info");
                return;
            }
            const postRef = doc(db, "posts", postId);
            if (isUnliked) {
                await updateDoc(postRef, { unlikes: arrayRemove(currentUserObj.uid) });
            } else {
                await updateDoc(postRef, {
                    unlikes: arrayUnion(currentUserObj.uid),
                    likes: arrayRemove(currentUserObj.uid)
                });
                const targetPost = latestDocs.find(p => p.id === postId);
                if (targetPost) {
                    const snippet = targetPost.text ? targetPost.text.substring(0, 45) : t.photoPostTag;
                    await logActivityHistory('unlike', postId, snippet);
                    await notifyPostParticipants(targetPost, 'unlike', snippet, "", true);
                }
            }
        };

        window.sharePost = async function(postId) {
            const t = translations[currentLang];
            const postObj = latestDocs.find(p => p.id === postId);
            const baseUrl = window.location.origin + window.location.pathname;
            const shareUrl = `${baseUrl}?post=${encodeURIComponent(postId)}`;

            const author = postObj?.authorName || "Sindhi World Book";
            const snippet = postObj?.text ? postObj.text.trim().substring(0, 120) : "";
            const shareText = snippet
                ? `${author} on Sindhi World Book:
"${snippet}"
`
                : `${author} shared a post on Sindhi World Book:
`;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: "Sindhi World Book",
                        text: shareText,
                        url: shareUrl
                    });
                    return;
                } catch (err) {
                    if (err && err.name === "AbortError") return;
                }
            }

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(`${shareText}${shareUrl}`);
                }
            } catch (e) {}

            showCustomAlert(
                t.sharePostTitle,
                `${t.linkCopiedMsg}

${shareUrl}`,
                t.alertOkBtn,
                "info"
            );
        };

        window.addComment = async function(event, postId) {
            event.preventDefault();
            const t = translations[currentLang];
            const targetCheckPost = latestDocs.find(p => p.id === postId);
            if (!canInteractWithPost(targetCheckPost)) {
                const aName = targetCheckPost?.authorName || "User";
                showCustomAlert(t.friendOnlyInteractTitle, t.friendOnlyInteractMsg.replace(/\{username\}/g, aName), t.alertOkBtn, "info");
                return;
            }
            const input = document.getElementById(`comment-input-${postId}`);
            const commentText = input.value.trim();
            if (!commentText) return;

            const cNow = new Date();
            const cH24 = cNow.getHours();
            const cAmPm = cH24 >= 12 ? "PM" : "AM";
            const cH12 = cH24 % 12 === 0 ? 12 : cH24 % 12;

            const postRef = doc(db, "posts", postId);
            await updateDoc(postRef, {
                comments: arrayUnion({
                    authorId: currentUserObj.uid,
                    author: currentUserObj.name,
                    text: commentText,
                    createdAtMs: Date.now(),
                    commentYear: cNow.getFullYear(),
                    commentMonth: cNow.getMonth() + 1,
                    commentDay: cNow.getDate(),
                    commentHour12: cH12,
                    commentAmPm: cAmPm,
                    commentMinute: cNow.getMinutes(),
                    likes: [],
                    unlikes: [],
                    edited: false
                })
            });

            await logActivityHistory('reply', postId, commentText.substring(0, 45));

            const targetPost = latestDocs.find(p => p.id === postId);
            if (targetPost) {
                const snippet = targetPost.text ? targetPost.text.substring(0, 45) : t.photoPostTag;
                await notifyPostParticipants(targetPost, 'comment', snippet, commentText, true);
            }
        };

        window.revealAuthFromSharedPost = function() {
            const authSec = document.getElementById('auth-section');
            const toggleWrap = document.getElementById('shared-post-login-toggle-wrap');
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const authMsg = document.getElementById('auth-message');
            if (signupForm) signupForm.classList.add('hidden');
            if (loginForm) loginForm.classList.remove('hidden');
            if (authMsg) authMsg.classList.add('hidden');
            if (authSec) {
                authSec.classList.remove('hidden');
                authSec.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            if (toggleWrap) {
                toggleWrap.classList.add('hidden');
            }
        };

        async function renderLoggedOutSharedPostPreview(postId) {
            const prevSec = document.getElementById('shared-post-preview-section');
            const prevBody = document.getElementById('shared-post-preview-body');
            const authSec = document.getElementById('auth-section');
            if (!prevSec || !prevBody || !postId) return;

            const t = translations[currentLang];
            try {
                const postSnap = await getDoc(doc(db, "posts", postId));
                if (!postSnap.exists()) {
                    prevSec.classList.add('hidden');
                    if (authSec) authSec.classList.remove('hidden');
                    showCustomAlert(t.noticeTitle, t.postDeletedAlert, t.alertOkBtn, "info");
                    return;
                }
                const pData = postSnap.data();
                const pPriv = pData.privacy || 'public';
                if (pPriv === 'private') {
                    const authorName = pData.authorName || "User";
                    const blockedMsg = t.privatePostBlockedMsg.replace(/\{username\}/g, authorName);
                    prevSec.classList.add('hidden');
                    if (authSec) authSec.classList.remove('hidden');
                    showCustomAlert(t.privatePostBlockedTitle, blockedMsg, t.alertOkBtn, "error");
                    return;
                }

                const authorName = pData.authorName || "Sindhi World Book";
                let authorPhotoUrl = null;
                if (pData.authorId) {
                    try {
                        const uSnap = await getDoc(doc(db, "users", pData.authorId));
                        if (uSnap.exists() && uSnap.data().photoUrl) {
                            authorPhotoUrl = uSnap.data().photoUrl;
                        }
                    } catch (uErr) {}
                }
                const avatarInner = getAvatarHTML(authorPhotoUrl, authorName);
                const textHTML = pData.text ? `<div class="post-content">${escapeHTML(pData.text)}</div>` : '';
                const imgHTML = pData.image ? `<img src="${escapeHTML(pData.image)}" class="post-image" alt="Shared Post Image" loading="lazy" draggable="false" oncontextmenu="return false;">` : '';
                const likesCount = Array.isArray(pData.likes) ? pData.likes.length : 0;
                const unlikesCount = Array.isArray(pData.unlikes) ? pData.unlikes.length : 0;
                const commentsArr = Array.isArray(pData.comments) ? pData.comments : [];

                let commentsHTML = '';
                commentsArr.forEach((c) => {
                    commentsHTML += `
                        <div class="comment-item">
                            <div class="comment-top">
                                <span class="comment-author">${escapeHTML(c.author || 'User')}</span>
                            </div>
                            <div class="comment-body-text">${escapeHTML(c.text || '')}</div>
                        </div>
                    `;
                });

                prevBody.innerHTML = `
                    <div id="shared-post-login-toggle-wrap" class="shared-post-floating-login-wrap">
                        <button type="button" class="shared-post-floating-login-btn" onclick="revealAuthFromSharedPost()">${t.btnLogin}</button>
                    </div>
                    <span class="shared-post-badge">${t.sharedPostBadge}</span>
                    <div class="post-header">
                        <div class="author-info">
                            <div class="avatar">${avatarInner}</div>
                            <div>
                                <div class="author-name">${escapeHTML(authorName)} <span class="post-privacy-badge public">${t.postPublicBtn}</span></div>
                                <div class="post-time">${escapeHTML(pData.timeText || '')}</div>
                            </div>
                        </div>
                    </div>
                    ${textHTML}
                    ${imgHTML}
                    <div class="post-stats">
                        <span>❤️ ${likesCount} ${t.likesCount}</span>
                        <span>💔 ${unlikesCount} ${t.unlikesCount}</span>
                        <span>${commentsArr.length} ${t.commentsCount}</span>
                    </div>
                    <div class="comments-section" style="margin-top:10px;">
                        ${commentsHTML}
                    </div>
                `;
                prevSec.classList.remove('hidden');
            } catch (err) {
                console.log("Shared post preview error:", err);
                prevSec.classList.add('hidden');
                const authMsgEl = document.getElementById('auth-message');
                if (authMsgEl) authMsgEl.classList.add('hidden');
                if (authSec) authSec.classList.remove('hidden');
            }
        }

        setLanguage(currentLang);
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").then(async (reg) => {
                    reg.update();
                    if ("periodicSync" in reg) {
                        try {
                            await reg.periodicSync.register("check-sindhi-world-book", {
                                minInterval: 15 * 60 * 1000
                            });
                        } catch (e) {}
                    }
                }).catch((err) => {
                    console.log("SW registration failed:", err);
                });
            });
        }
    </script>

    <script>
        document.addEventListener("contextmenu", function(e) {
            if (e.target && e.target.closest && e.target.closest(".post-image")) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, true);

        document.addEventListener("dragstart", function(e) {
            if (e.target && e.target.closest && e.target.closest(".post-image")) {
                e.preventDefault();
                return false;
            }
        }, true);
    </script>

    <script>
        function syncChatViewOnReturn() {
            if (document.visibilityState !== "visible") return;
            const convView = document.getElementById("chat-conversation-view");
            const popupMsg = document.getElementById("popup-messages");
            if (convView && !convView.classList.contains("hidden") && typeof window.renderActiveChatMessages === "function") {
                window.renderActiveChatMessages();
            } else if (popupMsg && !popupMsg.classList.contains("hidden") && typeof window.renderChatFriendsList === "function") {
                window.renderChatFriendsList();
            }
        }
        document.addEventListener("visibilitychange", syncChatViewOnReturn);
        window.addEventListener("focus", syncChatViewOnReturn);
    </script>

</body>
</html>
