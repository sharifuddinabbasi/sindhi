        let myCropSrcUrl = null;
        let myCropZoom = 1.2;
        let myCropPanX = 0;
        let myCropPanY = 0;

        function clampPan(val, zoomVal, stageSize = 160) {
            const maxPan = Math.max(40, ((zoomVal - 1) * stageSize) / 2 + stageSize * 0.45);
            return Math.max(-maxPan, Math.min(maxPan, val));
        }

        function applyCropTransformToImg(imgEl, zoomVal, panX, panY) {
            if (!imgEl) return;
            imgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomVal})`;
        }

        function attachTouchGestureCropper(stageEl, imgEl, stateGetter, stateSetter) {
            if (!stageEl || !imgEl) return;
            let isDragging = false;
            let startX = 0;
            let startY = 0;
            let startPanX = 0;
            let startPanY = 0;
            let pinchStartDist = 0;
            let pinchStartZoom = 1;

            function getTouchDist(t0, t1) {
                return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
            }

            stageEl.addEventListener("touchstart", function(e) {
                if (e.touches.length === 2) {
                    isDragging = false;
                    pinchStartDist = getTouchDist(e.touches[0], e.touches[1]);
                    pinchStartZoom = stateGetter().zoom;
                    e.preventDefault();
                } else if (e.touches.length === 1) {
                    isDragging = true;
                    const st = stateGetter();
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    startPanX = st.panX;
                    startPanY = st.panY;
                    e.preventDefault();
                }
            }, { passive: false });

            stageEl.addEventListener("touchmove", function(e) {
                const st = stateGetter();
                if (e.touches.length === 2 && pinchStartDist > 0) {
                    const dist = getTouchDist(e.touches[0], e.touches[1]);
                    const nextZoom = Math.max(1, Math.min(3.5, pinchStartZoom * (dist / pinchStartDist)));
                    const nextPanX = clampPan(st.panX, nextZoom);
                    const nextPanY = clampPan(st.panY, nextZoom);
                    stateSetter({ zoom: nextZoom, panX: nextPanX, panY: nextPanY });
                    applyCropTransformToImg(imgEl, nextZoom, nextPanX, nextPanY);
                    e.preventDefault();
                } else if (e.touches.length === 1 && isDragging) {
                    const dx = e.touches[0].clientX - startX;
                    const dy = e.touches[0].clientY - startY;
                    const nextPanX = clampPan(startPanX + dx, st.zoom);
                    const nextPanY = clampPan(startPanY + dy, st.zoom);
                    stateSetter({ zoom: st.zoom, panX: nextPanX, panY: nextPanY });
                    applyCropTransformToImg(imgEl, st.zoom, nextPanX, nextPanY);
                    e.preventDefault();
                }
            }, { passive: false });

            stageEl.addEventListener("touchend", function(e) {
                if (e.touches.length === 1) {
                    const st = stateGetter();
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    startPanX = st.panX;
                    startPanY = st.panY;
                    isDragging = true;
                    pinchStartDist = 0;
                } else if (e.touches.length === 0) {
                    isDragging = false;
                    pinchStartDist = 0;
                }
            });

            // Mouse / pointer fallback for desktop testing
            stageEl.addEventListener("pointerdown", function(e) {
                if (e.pointerType === "touch") return;
                isDragging = true;
                const st = stateGetter();
                startX = e.clientX;
                startY = e.clientY;
                startPanX = st.panX;
                startPanY = st.panY;
                stageEl.setPointerCapture(e.pointerId);
            });

            stageEl.addEventListener("pointermove", function(e) {
                if (e.pointerType === "touch" || !isDragging) return;
                const st = stateGetter();
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const nextPanX = clampPan(startPanX + dx, st.zoom);
                const nextPanY = clampPan(startPanY + dy, st.zoom);
                stateSetter({ zoom: st.zoom, panX: nextPanX, panY: nextPanY });
                applyCropTransformToImg(imgEl, st.zoom, nextPanX, nextPanY);
            });

            stageEl.addEventListener("pointerup", function(e) {
                if (e.pointerType === "touch") return;
                isDragging = false;
            });

            stageEl.addEventListener("wheel", function(e) {
                e.preventDefault();
                const st = stateGetter();
                const delta = e.deltaY < 0 ? 0.15 : -0.15;
                const nextZoom = Math.max(1, Math.min(3.5, Number((st.zoom + delta).toFixed(2))));
                const nextPanX = clampPan(st.panX, nextZoom);
                const nextPanY = clampPan(st.panY, nextZoom);
                stateSetter({ zoom: nextZoom, panX: nextPanX, panY: nextPanY });
                applyCropTransformToImg(imgEl, nextZoom, nextPanX, nextPanY);
            }, { passive: false });
        }

        function buildZoomedSquareDataUrl(srcUrl, zoomVal, outSize = 320, panX = 0, panY = 0, stageSize = 160) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = function() {
                    const iw = img.naturalWidth || img.width;
                    const ih = img.naturalHeight || img.height;
                    if (!iw || !ih) {
                        reject(new Error("Invalid image"));
                        return;
                    }
                    const z = Math.max(1, Math.min(3.5, Number(zoomVal) || 1));
                    const coverScale = Math.max(stageSize / iw, stageSize / ih);
                    const dispW = iw * coverScale * z;
                    const dispH = ih * coverScale * z;

                    // Top-left of zoomed image relative to stage center
                    const leftInStage = (stageSize - dispW) / 2 + (Number(panX) || 0);
                    const topInStage = (stageSize - dispH) / 2 + (Number(panY) || 0);

                    const canvas = document.createElement('canvas');
                    canvas.width = outSize;
                    canvas.height = outSize;
                    const ctx = canvas.getContext('2d');
                    const ratio = outSize / stageSize;
                    ctx.drawImage(img, leftInStage * ratio, topInStage * ratio, dispW * ratio, dispH * ratio);
                    resolve(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.onerror = function() {
                    reject(new Error("Image load failed"));
                };
                img.src = srcUrl;
            });
        }

            try {
                const croppedData = await buildZoomedSquareDataUrl(myCropSrcUrl, myCropZoom, 320, myCropPanX, myCropPanY, 160);

        window.deleteUserAccount = async function() {
            const t = translations[currentLang];
            if (!navigator.onLine) {
                showCustomAlert(t.noInternetTitle, t.noInternetDesc, t.alertOkBtn, "network");
                return;
            }
            const passInput = document.getElementById('setting-delete-acc-pass');
            const enteredPass = passInput ? passInput.value : '';
            const msgBox = document.getElementById('delete-account-status-msg');
            const btn = document.getElementById('btn-confirm-delete-account');
            const authUser = auth.currentUser;

            if (msgBox) msgBox.classList.add('hidden');

            if (!enteredPass) {
                if (msgBox) {
                    msgBox.innerText = t.deleteAccountEmptyPassError;
                    msgBox.className = "status-msg status-error";
                    msgBox.classList.remove('hidden');
                }
                return;
            }

            if (!authUser || !authUser.email) return;

            if (btn) {
                btn.disabled = true;
                btn.innerText = t.deletingAccountStatus;
            }

            try {
                const credential = EmailAuthProvider.credential(authUser.email, enteredPass);
                await reauthenticateWithCredential(authUser, credential);

                const uidToDelete = authUser.uid;

                // Delete user's posts
                try {
                    const postsSnap = await getDocs(query(collection(db, "posts"), where("authorId", "==", uidToDelete)));
                    for (const pDoc of postsSnap.docs) {
                        await deleteDoc(doc(db, "posts", pDoc.id)).catch(() => {});
                    }
                } catch (e) {}

                // Delete user's history & notifications
                try {
                    const histSnap = await getDocs(query(collection(db, "history"), where("uid", "==", uidToDelete)));
                    for (const hDoc of histSnap.docs) {
                        await deleteDoc(doc(db, "history", hDoc.id)).catch(() => {});
                    }
                } catch (e) {}

                try {
                    const notifSnap = await getDocs(query(collection(db, "notifications"), where("toUid", "==", uidToDelete)));
                    for (const nDoc of notifSnap.docs) {
                        await deleteDoc(doc(db, "notifications", nDoc.id)).catch(() => {});
                    }
                } catch (e) {}

                // Remove deleted user from other users' friends & friendRequests arrays
                try {
                    const allUsersSnap = await getDocs(collection(db, "users"));
                    for (const otherDoc of allUsersSnap.docs) {
                        if (otherDoc.id === uidToDelete) continue;
                        const oData = otherDoc.data() || {};
                        const hasFriend = Array.isArray(oData.friends) && oData.friends.includes(uidToDelete);
                        const hasReq = Array.isArray(oData.friendRequests) && oData.friendRequests.includes(uidToDelete);
                        if (hasFriend || hasReq) {
                            const patch = {};
                            if (hasFriend) patch.friends = arrayRemove(uidToDelete);
                            if (hasReq) patch.friendRequests = arrayRemove(uidToDelete);
                            await updateDoc(doc(db, "users", otherDoc.id), patch).catch(() => {});
                        }
                    }
                } catch (e) {}

                // Delete user profile document (and any stale docs with same email)
                await deleteDoc(doc(db, "users", uidToDelete)).catch(() => {});
                if (authUser.email) {
                    try {
                        const sameEmailSnap = await getDocs(query(collection(db, "users"), where("email", "==", authUser.email.trim().toLowerCase())));
                        for (const uDoc of sameEmailSnap.docs) {
                            await deleteDoc(doc(db, "users", uDoc.id)).catch(() => {});
                        }
                    } catch (e) {}
                }

                // Delete Firebase Auth account
                await deleteUser(authUser);

                if (unsubscribePosts) unsubscribePosts();
                if (unsubscribeUsers) unsubscribeUsers();
                if (unsubscribeMyProfile) unsubscribeMyProfile();
                if (unsubscribeNotifs) unsubscribeNotifs();
                if (unsubscribeHistory) unsubscribeHistory();
                if (presenceHeartbeatTimer) { clearInterval(presenceHeartbeatTimer); presenceHeartbeatTimer = null; }
                if (unsubscribeMessages) unsubscribeMessages();

                closePopup();
                currentUserObj = null;
                document.getElementById('feed-section').classList.add('hidden');
                document.getElementById('user-nav').classList.add('hidden');
                document.getElementById('fb-icon-bar').classList.add('hidden');
                document.getElementById('auth-section').classList.remove('hidden');
                showMessage(t.deleteAccountSuccessMsg, false);
            } catch (err) {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = t.deleteAccountBtn;
                }
                if (isNetworkError(err)) {
                    showCustomAlert(t.noInternetTitle, t.noInternetDesc, t.alertOkBtn, "network");
                } else if (msgBox) {
                    const errCode = (err?.code || '').toLowerCase();
                    msgBox.innerText = (errCode.includes('wrong-password') || errCode.includes('invalid-credential'))
                        ? t.deleteAccountWrongPassError
                        : (err.message || t.deleteAccountWrongPassError);
                    msgBox.className = "status-msg status-error";
                    msgBox.classList.remove('hidden');
                }
            }
        };

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 800;
                    const scale = maxWidth / img.width;
                    canvas.width = img.width > maxWidth ? maxWidth : img.width;
                    canvas.height = img.width > maxWidth ? img.height * scale : img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/jpeg', 0.75));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function findAbusiveContent(rawText) {
            const text = String(rawText || "").trim();
            if (!text) return [];
            const lower = text.toLowerCase();
            const found = [];

            for (const term of ABUSIVE_TERMS) {
                const tLower = term.toLowerCase();
                if (!tLower) continue;
                const isAsciiWord = /^[a-z0-9\s]+$/.test(tLower);
                if (isAsciiWord) {
                    const escaped = tLower.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+");
                    const re = new RegExp(`(^|[^a-z0-9])${escaped}(?=[^a-z0-9]|$)`, "i");
                    if (re.test(lower)) {
                        found.push(term);
                    }
                } else {
                    if (lower.includes(tLower)) {
                        found.push(term);
                    }
                }
            }
            return Array.from(new Set(found));
        }

        const FULL_MONTH_NAMES = [

        ];

        function extractItemDateParts(item, fallbackParts = null) {
            const d = item?.createdAt?.toDate
                ? item.createdAt.toDate()
                : (typeof item?.createdAt?.seconds === 'number'
                    ? new Date(item.createdAt.seconds * 1000)
                    : (typeof item?.createdAtMs === 'number' ? new Date(item.createdAtMs) : null));

            const yr = typeof item?.postYear === 'number'
                ? item.postYear
                : (typeof item?.commentYear === 'number'
                    ? item.commentYear
                    : (d ? d.getFullYear() : (fallbackParts?.year ?? null)));

            const mo = typeof item?.postMonth === 'number'
                ? item.postMonth
                : (typeof item?.commentMonth === 'number'
                    ? item.commentMonth
                    : (d ? (d.getMonth() + 1) : (fallbackParts?.month ?? null)));

            const dy = typeof item?.postDay === 'number'
                ? item.postDay
                : (typeof item?.commentDay === 'number'
                    ? item.commentDay
                    : (d ? d.getDate() : (fallbackParts?.day ?? null)));

            let hr12 = typeof item?.postHour12 === 'number'
                ? item.postHour12
                : (typeof item?.commentHour12 === 'number' ? item.commentHour12 : null);
            let ap = item?.postAmPm || item?.commentAmPm || null;

            if ((hr12 === null || !ap) && d) {
                const h24 = d.getHours();
                ap = h24 >= 12 ? "PM" : "AM";
                hr12 = h24 % 12 === 0 ? 12 : h24 % 12;
            }
            if ((hr12 === null || !ap) && fallbackParts) {
                hr12 = fallbackParts.hour12 ?? null;
                ap = fallbackParts.ampm ?? null;
            }

            const mi = typeof item?.postMinute === 'number'
                ? item.postMinute
                : (typeof item?.commentMinute === 'number'
                    ? item.commentMinute
                    : (d ? d.getMinutes() : (fallbackParts?.minute ?? null)));

            return { year: yr, month: mo, day: dy, hour12: hr12, ampm: ap, minute: mi };
        }

        function matchesAdminTimeSelection(parts, selY, selM, selD, selH, selMin) {
            if (selY !== 'ALL' && String(parts.year) !== selY) return false;
            if (selM !== 'ALL' && String(parts.month) !== selM) return false;
            if (selD !== 'ALL' && String(parts.day).padStart(2, '0') !== selD) return false;
            if (selH !== 'ALL') {
                const hLabel = (parts.hour12 !== null && parts.ampm)
                    ? `${String(parts.hour12).padStart(2, '0')} ${parts.ampm}`
                    : '';
                if (hLabel !== selH) return false;
            }
            if (selMin !== 'ALL' && String(parts.minute).padStart(2, '0') !== selMin) return false;
            return true;
        }

        function isUserCurrentlyOnline(userObj) {
            if (!userObj || !userObj.uid || userObj.blocked === true) return false;
            if (currentUserObj && userObj.uid === currentUserObj.uid) return false;
            const lastSeen = typeof userObj.lastSeenMs === 'number'
                ? userObj.lastSeenMs
                : (typeof userObj.activeSinceMs === 'number' ? userObj.activeSinceMs : 0);
            if (!lastSeen) return false;
            return (Date.now() - lastSeen) <= (5 * 60 * 1000);
        }

        function getOnlineRingClass(userObj) {
            return isUserCurrentlyOnline(userObj) ? 'online-golden-ring' : '';
        }

        function formatDateTime12h(ms) {
            if (!ms || typeof ms !== 'number') return '';
            try {
                const dt = new Date(ms);
                const h24 = dt.getHours();
                const ampm = h24 >= 12 ? 'PM' : 'AM';
                const h12 = String(h24 % 12 === 0 ? 12 : h24 % 12).padStart(2, '0');
                const min = String(dt.getMinutes()).padStart(2, '0');
                const day = String(dt.getDate()).padStart(2, '0');
                const month = String(dt.getMonth() + 1).padStart(2, '0');
                const year = dt.getFullYear();
                return `${h12}:${min} ${ampm}, ${day}-${month}-${year}`;
            } catch (e) {
                return '';
            }
        }

        function formatTimeOnly(ms) {
            if (!ms || typeof ms !== 'number') return '';
            try {
                return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return '';
            }
        }

        async function updateMyPresence(isNewSession = false) {
            if (!currentUserObj || !currentUserObj.uid || !navigator.onLine) return;
            const nowMs = Date.now();
            try {
                const userRef = doc(db, "users", currentUserObj.uid);
                const snap = await getDoc(userRef);
                const prevData = snap.exists() ? snap.data() : {};
                const prevLastSeen = typeof prevData.lastSeenMs === 'number' ? prevData.lastSeenMs : 0;
                const wasOfflineOver5Min = prevLastSeen > 0 && ((nowMs - prevLastSeen) > 5 * 60 * 1000);

                let activeSince = typeof prevData.activeSinceMs === 'number' ? prevData.activeSinceMs : nowMs;
                if (isNewSession || wasOfflineOver5Min || !prevData.activeSinceMs) {
                    activeSince = nowMs;
                }

                await updateDoc(userRef, {
                    activeSinceMs: activeSince,
                    lastSeenMs: nowMs
                }).catch(() => {});
            } catch (e) {}
        }

        window.adminOpenPairChatEditor = function(userAUid, userBUid) {
            if (!isAdminUser() || !userAUid || !userBUid) return;
            const t = translations[currentLang];
            adminChatPairUserA = userAUid;
            adminChatPairUserB = userBUid;

            document.getElementById('modal-title').innerText = t.adminModifyChatTitle;
            document.getElementById('modal-header-extra').innerHTML = `
                <button type="button" class="btn-sm neutral" onclick="adminOpenUserDetailsPopup('${userAUid}')">${t.backBtn}</button>
            `;

            if (unsubscribeAdminPairMsgs) {
                try { unsubscribeAdminPairMsgs(); } catch (e) {}
                unsubscribeAdminPairMsgs = null;
            }

            const q = query(
                collection(db, "messages"),
                where("participants", "array-contains", userAUid)
            );

            unsubscribeAdminPairMsgs = onSnapshot(q, (snapshot) => {
                const msgs = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const parts = Array.isArray(data.participants) ? data.participants : [];
                    if (parts.includes(userBUid) || (data.senderId === userBUid && data.receiverId === userAUid)) {
                        msgs.push({ id: docSnap.id, ...data });
                    }
                });
                msgs.sort((a, b) => (a.clientTime || 0) - (b.clientTime || 0));
                adminPairMessagesList = msgs;
                renderAdminPairChatView();
            });
        };

            const selMin = document.getElementById('admin-select-minute')?.value || 'ALL';

                let userCommentedInMatch = false;

        window.renderAdminFilteredUsers = function(postsArray = latestDocs) {
            if (!isAdminUser()) return;
            const postsCont = document.getElementById('posts-container');
            if (!postsCont) return;

            const selY = document.getElementById('admin-select-year')?.value || 'ALL';
            const selM = document.getElementById('admin-select-month')?.value || 'ALL';
            const selD = document.getElementById('admin-select-day')?.value || 'ALL';
            const selH = document.getElementById('admin-select-hour')?.value || 'ALL';
            const selMin = document.getElementById('admin-select-minute')?.value || 'ALL';
            const searchQuery = (document.getElementById('admin-filtered-search-input')?.value || '').trim().toLowerCase();

            const matchedUsersMap = new Map();

            function addMatchedUser(uid, fallbackName, activityType) {
                if (!uid || uid === currentUserObj?.uid) return;
                const uObj = allUsersList.find(u => u.uid === uid);
                const name = (uObj && uObj.name) ? uObj.name : (fallbackName || 'User');
                const email = (uObj && uObj.email) ? uObj.email : '';
                const photoUrl = (uObj && uObj.photoUrl) ? uObj.photoUrl : null;
                const blocked = Boolean(uObj && uObj.blocked === true);

                if (searchQuery) {
                    const matchName = name.toLowerCase().includes(searchQuery);
                    const matchEmail = email.toLowerCase().includes(searchQuery);
                    if (!matchName && !matchEmail) return;
                }

                if (!matchedUsersMap.has(uid)) {
                    matchedUsersMap.set(uid, {
                        uid,
                        name,
                        email,
                        photoUrl,
                        blocked,
                        postsCount: 0,
                        commentsCount: 0
                    });
                }
                const entry = matchedUsersMap.get(uid);
                if (activityType === 'post') entry.postsCount += 1;
                if (activityType === 'comment') entry.commentsCount += 1;
            }

            (postsArray || []).forEach(p => {

        function syncAdminFeedState(postsArray = latestDocs) {
            const adminSec = document.getElementById('admin-filter-section');
            const createCardEl = document.querySelector('#feed-section .create-post');

            if (isAdminUser()) {
                if (adminSec) adminSec.classList.remove('hidden');
                if (createCardEl) createCardEl.classList.add('hidden');

                const ySel = document.getElementById('admin-select-year');
                const mSel = document.getElementById('admin-select-month');
                const dSel = document.getElementById('admin-select-day');
                const hSel = document.getElementById('admin-select-hour');
                const minSel = document.getElementById('admin-select-minute');

                const years = new Set();
                const months = new Set();
                const days = new Set();
                const hoursAmPm = new Set();
                const minutes = new Set();

                function collectParts(parts) {
                    if (parts.year !== null) years.add(String(parts.year));
                    if (parts.month !== null && parts.month >= 1 && parts.month <= 12) months.add(Number(parts.month));
                    if (parts.day !== null) days.add(String(parts.day).padStart(2, '0'));
                    if (parts.hour12 !== null && parts.ampm) hoursAmPm.add(`${String(parts.hour12).padStart(2, '0')} ${parts.ampm}`);
                    if (parts.minute !== null) minutes.add(String(parts.minute).padStart(2, '0'));
                }

                (postsArray || []).forEach(p => {
                    const pParts = extractItemDateParts(p, null);
                    collectParts(pParts);
                    (p.comments || []).forEach(c => {
                        const cParts = extractItemDateParts(c, pParts);
                        collectParts(cParts);
                    });
                });

                function populateWithAllFirst(sel, setObj, sortFn, labelFn = (v) => v) {
                    if (!sel) return;
                    const prev = sel.value || 'ALL';
                    const sorted = Array.from(setObj).sort(sortFn);
                    sel.innerHTML = `<option value="ALL">All</option>` + sorted.map(v => `<option value="${v}">${labelFn(v)}</option>`).join('');
                    const strSorted = sorted.map(v => String(v));
                    sel.value = strSorted.includes(prev) ? prev : 'ALL';
                }

                populateWithAllFirst(ySel, years, (a, b) => Number(b) - Number(a));
                populateWithAllFirst(mSel, months, (a, b) => Number(a) - Number(b), (mNum) => FULL_MONTH_NAMES[Number(mNum) - 1] || mNum);
                populateWithAllFirst(dSel, days, (a, b) => Number(a) - Number(b));
                populateWithAllFirst(hSel, hoursAmPm, (a, b) => {
                    const [ha, pa] = a.split(' ');
                    const [hb, pb] = b.split(' ');
                    if (pa !== pb) return pa === 'AM' ? -1 : 1;
                    return Number(ha) - Number(hb);
                });
                populateWithAllFirst(minSel, minutes, (a, b) => Number(a) - Number(b));

                renderAdminFilteredUsers(postsArray);
                return true;
            } else {
                if (adminSec) adminSec.classList.add('hidden');
                if (createCardEl) createCardEl.classList.remove('hidden');
                return false;
            }
        }

        async function createTop25PercentImageFile(imageUrl) {
            if (!imageUrl) return null;
            return new Promise((resolve) => {
                try {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = function() {
                        try {
                            const w = img.naturalWidth || img.width;
                            const h = img.naturalHeight || img.height;
                            if (!w || !h) {
                                resolve(null);
                                return;
                            }
                            const cropHeight = Math.max(1, Math.round(h * 0.25));
                            const canvas = document.createElement("canvas");
                            canvas.width = w;
                            canvas.height = cropHeight;
                            const ctx = canvas.getContext("2d");
                            ctx.drawImage(img, 0, 0, w, cropHeight, 0, 0, w, cropHeight);
                            canvas.toBlob((blob) => {
                                if (!blob) {
                                    resolve(null);
                                    return;
                                }
                                const file = new File([blob], "sindhi_world_book_preview.jpg", { type: "image/jpeg" });
                                resolve(file);
                            }, "image/jpeg", 0.88);
                        } catch (e) {
                            resolve(null);
                        }
                    };
                    img.onerror = function() {
                        resolve(null);
                    };
                    img.src = imageUrl;
                } catch (e) {
                    resolve(null);
                }
            });
        }

        window.sharePost = async function(postId) {
            const t = translations[currentLang];
            const postObj = latestDocs.find(p => p.id === postId);
            const baseUrl = window.location.origin + window.location.pathname;
            const shareUrl = `${baseUrl}?post=${encodeURIComponent(postId)}`;

            const author = postObj?.authorName || "Sindhi World Book";
            const snippet = postObj?.text ? postObj.text.trim().substring(0, 120) : "";
            const shareText = snippet
                ? `${author} on Sindhi World Book:
"${snippet}"
${shareUrl}`
                : `${author} shared a post on Sindhi World Book:
${shareUrl}`;

            if (navigator.share) {
                try {
                    let previewFile = null;
                    if (postObj && postObj.image) {
                        previewFile = await createTop25PercentImageFile(postObj.image);
                    }

                    if (previewFile && navigator.canShare && navigator.canShare({ files: [previewFile] })) {
                        await navigator.share({
                            title: "Sindhi World Book",
                            text: shareText,
                            files: [previewFile]
                        });
                        return;
                    }

                    await navigator.share({
                        title: "Sindhi World Book",
                        text: shareText,
                        url: shareUrl
                    });
                    return;
                } catch (err) {
                    if (err && err.name === "AbortError") return;
                }
            }

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(shareText);
                }
            } catch (e) {}

            showCustomAlert(
                t.sharePostTitle,
                `${t.linkCopiedMsg}

${shareUrl}`,
                t.alertOkBtn,
                "info"
            );
        };

        window.addComment = async function(event, postId) {

            const input = document.getElementById(`comment-input-${postId}`);

            if (abusiveCommentWords.length > 0) {
                showCustomAlert(t.noticeTitle, buildAbusiveCommentAlertText(abusiveCommentWords), t.alertOkBtn, "error");
                return;
            }

            const cNow = new Date();
            const cH24 = cNow.getHours();
            const cAmPm = cH24 >= 12 ? "PM" : "AM";
            const cH12 = cH24 % 12 === 0 ? 12 : cH24 % 12;

            const postRef = doc(db, "posts", postId);
            await updateDoc(postRef, {
                comments: arrayUnion({
                    authorId: currentUserObj.uid,
                    author: currentUserObj.name,
                    text: commentText,
                    createdAtMs: Date.now(),
                    commentYear: cNow.getFullYear(),
                    commentMonth: cNow.getMonth() + 1,
                    commentDay: cNow.getDate(),
                    commentHour12: cH12,
                    commentAmPm: cAmPm,
                    commentMinute: cNow.getMinutes(),
                    likes: [],
                    unlikes: [],
                    edited: false
                })
            });

            await logActivityHistory('reply', postId, commentText.substring(0, 45));

            const targetPost = latestDocs.find(p => p.id === postId);
            if (targetPost) {
                const snippet = targetPost.text ? targetPost.text.substring(0, 45) : t.photoPostTag;
                await notifyPostParticipants(targetPost, 'comment', snippet, commentText, true);

            if (authSec) {
                authSec.classList.remove('hidden');
                authSec.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            if (toggleWrap) {
                toggleWrap.classList.add('hidden');
            }
        };

        async function renderLoggedOutSharedPostPreview(postId) {
            const prevSec = document.getElementById('shared-post-preview-section');
            const prevBody = document.getElementById('shared-post-preview-body');
            const authSec = document.getElementById('auth-section');
            if (!prevSec || !prevBody || !postId) return;

            const t = translations[currentLang];
            try {
                const postSnap = await getDoc(doc(db, "posts", postId));
                if (!postSnap.exists()) {
                    prevSec.classList.add('hidden');
                    if (authSec) authSec.classList.remove('hidden');
                    showCustomAlert(t.noticeTitle, t.postDeletedAlert, t.alertOkBtn, "info");
                    return;
                }
                const pData = postSnap.data();
                const pPriv = pData.privacy || 'public';
                if (pPriv === 'private') {
                    const authorName = pData.authorName || "User";
                    const blockedMsg = t.privatePostBlockedMsg.replace(/\{username\}/g, authorName);
                    prevSec.classList.add('hidden');
                    if (authSec) authSec.classList.remove('hidden');
                    showCustomAlert(t.privatePostBlockedTitle, blockedMsg, t.alertOkBtn, "error");
                    return;
                }

                const authorName = pData.authorName || "Sindhi World Book";
                let authorPhotoUrl = null;
                if (pData.authorId) {
                    try {
                        const uSnap = await getDoc(doc(db, "users", pData.authorId));
                        if (uSnap.exists() && uSnap.data().photoUrl) {
                            authorPhotoUrl = uSnap.data().photoUrl;
                        }
                    } catch (uErr) {}
                }
                const avatarInner = getAvatarHTML(authorPhotoUrl, authorName);
                const textHTML = pData.text ? `<div class="post-content">${escapeHTML(pData.text)}</div>` : '';
                const imgHTML = pData.image ? `<img src="${escapeHTML(pData.image)}" class="post-image" alt="Shared Post Image" loading="lazy" draggable="false" oncontextmenu="return false;">` : '';
                const likesCount = Array.isArray(pData.likes) ? pData.likes.length : 0;
                const unlikesCount = Array.isArray(pData.unlikes) ? pData.unlikes.length : 0;
                const commentsArr = Array.isArray(pData.comments) ? pData.comments : [];

                let commentsHTML = '';
                commentsArr.forEach((c) => {
                    commentsHTML += `
                        <div class="comment-item">
                            <div class="comment-top">
                                <span class="comment-author">${escapeHTML(c.author || 'User')}</span>
                            </div>
                            <div class="comment-body-text">${escapeHTML(c.text || '')}</div>
                        </div>
                    `;
                });

                prevBody.innerHTML = `
                    <div id="shared-post-login-toggle-wrap" class="shared-post-floating-login-wrap">
                        <button type="button" class="shared-post-floating-login-btn" onclick="revealAuthFromSharedPost()">${t.btnLogin}</button>
                    </div>
                    <span class="shared-post-badge">${t.sharedPostBadge}</span>
                    <div class="post-header">
                        <div class="author-info">
                            <div class="avatar">${avatarInner}</div>
                            <div>
                                <div class="author-name">${escapeHTML(authorName)} <span class="post-privacy-badge public">${t.postPublicBtn}</span></div>
                                <div class="post-time">${escapeHTML(pData.timeText || '')}</div>
                            </div>
                        </div>
                    </div>
                    ${textHTML}
                    ${imgHTML}
                    <div class="post-stats">
                        <span>❤️ ${likesCount} ${t.likesCount}</span>
                        <span>💔 ${unlikesCount} ${t.unlikesCount}</span>
                        <span>${commentsArr.length} ${t.commentsCount}</span>
                    </div>
                    <div class="comments-section" style="margin-top:10px;">
                        ${commentsHTML}
                    </div>
                `;
                prevSec.classList.remove('hidden');
            } catch (err) {
                console.log("Shared post preview error:", err);
                prevSec.classList.add('hidden');
                const authMsgEl = document.getElementById('auth-message');
                if (authMsgEl) authMsgEl.classList.add('hidden');
                if (authSec) authSec.classList.remove('hidden');
            }
        }

        setLanguage(currentLang);
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").then(async (reg) => {
                    reg.update();
                    if ("periodicSync" in reg) {
                        try {
                            await reg.periodicSync.register("check-sindhi-world-book", {
                                minInterval: 15 * 60 * 1000
                            });
                        } catch (e) {}
                    }
                }).catch((err) => {
                    console.log("SW registration failed:", err);
                });
            });
        }
    </script>

    <script>
        document.addEventListener("contextmenu", function(e) {
            if (e.target && e.target.closest && e.target.closest(".post-image")) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, true);

        document.addEventListener("dragstart", function(e) {
            if (e.target && e.target.closest && e.target.closest(".post-image")) {
                e.preventDefault();
                return false;
            }
        }, true);
    </script>

    <script>
        function syncChatViewOnReturn() {
            if (document.visibilityState !== "visible") return;
            const convView = document.getElementById("chat-conversation-view");
            const popupMsg = document.getElementById("popup-messages");
            if (convView && !convView.classList.contains("hidden") && typeof window.renderActiveChatMessages === "function") {
                window.renderActiveChatMessages();
            } else if (popupMsg && !popupMsg.classList.contains("hidden") && typeof window.renderChatFriendsList === "function") {
                window.renderChatFriendsList();
            }
        }
        document.addEventListener("visibilitychange", syncChatViewOnReturn);
        window.addEventListener("focus", syncChatViewOnReturn);
    </script>

</body>
</html>
