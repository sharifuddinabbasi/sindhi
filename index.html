<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sindhi World Book - سنڌي ورلڊ بڪ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14284B">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ajrak-red: #8B1E24;
            --ajrak-dark-red: #5E1116;
            --normal-brown-text: #654321;
            --ajrak-blue: #14284B;
            --ajrak-dark-blue: #0B162C;
            --normal-blue-text: #0056b3;
            --ajrak-cream: #F4EFE6;
            --ajrak-gold: #D4AF37;
            --text-dark: #1A1A1A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ajrak-cream);
            background-image: 
                radial-gradient(circle at 100% 50%, transparent 20%, rgba(139, 30, 36, 0.04) 21%, rgba(139, 30, 36, 0.04) 34%, transparent 35%, transparent),
                radial-gradient(circle at 0% 50%, transparent 20%, rgba(20, 40, 75, 0.04) 21%, rgba(20, 40, 75, 0.04) 34%, transparent 35%, transparent);
            background-size: 40px 40px;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        html[lang="sd"] body,
        html[lang="sd"] input,
        html[lang="sd"] textarea,
        html[lang="sd"] button,
        html[lang="sd"] label {
            font-family: 'Noto Naskh Arabic', 'MB Latif', 'Segoe UI', Tahoma, sans-serif;
        }

        html[lang="sd"] body {
            font-size: 16px;
        }

        .ajrak-border-strip {
            height: 10px;
            width: 100%;
            background-color: var(--ajrak-dark-blue);
            background-image: 
                linear-gradient(45deg, var(--ajrak-red) 25%, transparent 25%), 
                linear-gradient(-45deg, var(--ajrak-red) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--ajrak-cream) 75%),
                linear-gradient(-45deg, transparent 75%, var(--ajrak-cream) 75%);
            background-size: 14px 14px;
            background-position: 0 0, 0 7px, 7px -7px, -7px 0;
            border-top: 2px solid var(--ajrak-gold);
            border-bottom: 2px solid var(--ajrak-gold);
        }

        header {
            background: linear-gradient(135deg, var(--ajrak-blue) 0%, var(--ajrak-dark-blue) 100%);
            color: var(--ajrak-cream);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25);
        }

        .header-top-row {
            padding: 10px 12px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        header h1 {
            font-size: 18px;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        header h1 span {
            color: var(--ajrak-gold);
            font-size: 16px;
        }

        .fb-icon-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-circle-btn {
            position: relative;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid var(--ajrak-gold);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .icon-circle-btn:hover, .icon-circle-btn.active {
            background-color: var(--ajrak-red);
            transform: scale(1.05);
        }

        .icon-circle-btn svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: #E41E3F;
            color: white;
            font-size: 10px;
            font-weight: bold;
            min-width: 17px;
            height: 17px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 1.5px solid #FFFFFF;
        }

        .header-bottom-row {
            padding: 4px 10px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            direction: ltr;
        }

        .lang-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--ajrak-gold);
            border-radius: 20px;
            padding: 2px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #EAE2D3;
            padding: 3px 8px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .lang-btn.active {
            background-color: var(--ajrak-red);
            color: #FFFFFF;
        }

        .btn-install-app {
            background: linear-gradient(135deg, #1E9E5A 0%, #157A43 100%);
            color: #FFFFFF;
            border: 1px solid #A7F3D0;
            padding: 4px 9px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            transition: 0.2s;
            flex-shrink: 0;
        }

        .btn-install-app:hover {
            transform: scale(1.03);
            background: #17874B;
        }

        .btn-install-app svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .user-dropdown-wrapper {
            position: relative;
            display: inline-block;
            flex-shrink: 0;
        }

        .user-menu-trigger {
            background-color: var(--ajrak-red);
            border: 1px solid var(--ajrak-gold);
            color: #FFFFFF;
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            max-width: 125px;
            transition: 0.2s;
        }

        .user-menu-trigger span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-menu-trigger:hover {
            background-color: var(--ajrak-dark-red);
        }

        .user-dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            background-color: #FFFFFF;
            min-width: 175px;
            border-radius: 10px;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
            border: 1.5px solid var(--ajrak-gold);
            overflow: hidden;
            z-index: 300;
            animation: popIn 0.15s ease-out;
        }

        .dropdown-item {
            width: 100%;
            background: none;
            border: none;
            border-bottom: 1px solid #EAE2D3;
            padding: 10px 14px;
            text-align: start;
            font-size: 14px;
            font-weight: 600;
            color: var(--ajrak-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: 0.15s;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background-color: var(--ajrak-cream);
        }

        .dropdown-item.logout-item {
            color: var(--ajrak-red);
        }

        .dropdown-item.logout-item:hover {
            background-color: #FFEBEE;
        }

        .dropdown-count-pill {
            background-color: #28A745;
            color: #FFFFFF;
            font-size: 11px;
            font-weight: bold;
            padding: 1px 7px;
            border-radius: 10px;
        }

        .alert-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 22, 44, 0.72);
            backdrop-filter: blur(2px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .alert-modal-box {
            background: #FFFFFF;
            width: 100%;
            max-width: 345px;
            border-radius: 14px;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.42);
            border: 1.5px solid var(--ajrak-gold);
            overflow: hidden;
            text-align: center;
            animation: bouncePop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bouncePop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .alert-modal-body {
            padding: 22px 18px 18px;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--ajrak-cream) 100%);
        }

        .alert-icon-circle {
            width: 58px;
            height: 58px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFEBEE 0%, #FFCDD2 100%);
            border: 2px solid var(--ajrak-red);
            color: var(--ajrak-red);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(139, 30, 36, 0.22);
        }

        .alert-icon-circle.network-icon {
            background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
            border-color: var(--ajrak-blue);
            color: var(--ajrak-blue);
            box-shadow: 0 4px 12px rgba(20, 40, 75, 0.22);
        }

        .alert-icon-circle.install-icon {
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
            border-color: #1E9E5A;
            color: #157A43;
            box-shadow: 0 4px 12px rgba(30, 158, 90, 0.22);
        }

        .alert-icon-circle svg {
            width: 30px;
            height: 30px;
            fill: currentColor;
        }

        .alert-modal-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--ajrak-red);
            margin-bottom: 6px;
        }

        .alert-modal-title.blue-title {
            color: var(--ajrak-blue);
        }

        .alert-modal-text {
            font-size: 13.5px;
            color: var(--ajrak-blue);
            line-height: 1.55;
            margin-bottom: 18px;
            font-weight: 500;
            white-space: pre-line;
        }

        .alert-modal-ok-btn {
            background: linear-gradient(135deg, var(--ajrak-blue) 0%, var(--ajrak-dark-blue) 100%);
            color: #FFFFFF;
            border: 1.5px solid var(--ajrak-gold);
            padding: 9px 32px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(20, 40, 75, 0.25);
            transition: 0.2s;
        }

        .alert-modal-ok-btn:hover {
            background: var(--ajrak-red);
            transform: scale(1.04);
        }

        .alert-modal-btn-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .alert-modal-cancel-btn {
            background: #EAE2D3;
            color: var(--ajrak-blue);
            border: 1.5px solid #C8BEB0;
            padding: 9px 22px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .alert-modal-cancel-btn:hover {
            background: #DCD4C6;
            transform: scale(1.03);
        }

        .alert-modal-ok-btn.danger-confirm {
            background: linear-gradient(135deg, var(--ajrak-red) 0%, var(--ajrak-dark-red) 100%);
            border-color: var(--ajrak-gold);
        }

        .alert-modal-ok-btn.danger-confirm:hover {
            background: var(--ajrak-dark-red);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 22, 44, 0.65);
            z-index: 999;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 55px 12px 20px;
            overflow-y: auto;
        }

        .modal-box {
            background: #FFFFFF;
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            border: 1px solid var(--ajrak-gold);
            overflow: hidden;
            animation: popIn 0.18s ease-out;
        }

        @keyframes popIn {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            background-color: var(--ajrak-cream);
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #DCD4C6;
        }

        .modal-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .modal-header h3 {
            color: var(--ajrak-blue);
            font-size: 16px;
        }

        .modal-close {
            background: var(--ajrak-red);
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }

        .modal-body {
            padding: 14px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .chat-friend-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FFFFFF;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid #E5DEC9;
            cursor: pointer;
            transition: 0.15s;
        }

        .chat-friend-row:hover {
            background: var(--ajrak-cream);
            border-color: #25D366;
        }

        .chat-friend-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .chat-friend-meta {
            min-width: 0;
            flex: 1;
        }

        .chat-friend-name {
            font-weight: bold;
            color: var(--ajrak-blue);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-last-preview {
            font-size: 12px;
            color: #667781;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .chat-unread-pill {
            background-color: #25D366;
            color: #FFFFFF;
            font-size: 11px;
            font-weight: bold;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            flex-shrink: 0;
        }

        .wa-chat-wrapper {
            display: flex;
            flex-direction: column;
            height: 410px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #C8BEB0;
        }

        .wa-chat-topbar {
            background-color: #075E54;
            color: #FFFFFF;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wa-back-btn {
            background: none;
            border: none;
            color: #FFFFFF;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 50%;
        }

        .wa-back-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        .wa-chat-topbar-name {
            font-weight: bold;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .wa-messages-area {
            flex: 1;
            background-color: #EFEAE2;
            background-image: radial-gradient(rgba(11, 20, 26, 0.06) 1px, transparent 1px);
            background-size: 16px 16px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .wa-msg-bubble {
            max-width: 78%;
            padding: 7px 10px 5px;
            border-radius: 8px;
            font-size: 13.5px;
            line-height: 1.45;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.13);
        }

        .wa-msg-sent {
            align-self: flex-end;
            background-color: #D9FDD3;
            color: #111B21;
            border-top-right-radius: 0;
        }

        .wa-msg-received {
            align-self: flex-start;
            background-color: #FFFFFF;
            color: #111B21;
            border-top-left-radius: 0;
        }

        .wa-msg-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #667781;
            margin-top: 3px;
            direction: ltr;
        }

        .wa-tick-sent {
            color: #8696A0;
            font-weight: bold;
            letter-spacing: -1px;
        }

        .wa-tick-delivered {
            color: #8696A0;
            font-weight: bold;
            letter-spacing: -1.5px;
        }

        .wa-tick-read {
            color: #1E9E5A;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .wa-input-bar {
            background-color: #F0F2F5;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #DCD4C6;
        }

        .wa-input-bar input {
            flex: 1;
            margin-bottom: 0;
            border-radius: 20px;
            background-color: #FFFFFF;
            border: 1px solid #D1D7DB;
            padding: 9px 14px;
            font-size: 14px;
        }

        .wa-send-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #00A884;
            color: #FFFFFF;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.15s;
        }

        .wa-send-btn:hover {
            background-color: #008F6F;
        }

        .wa-send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .setting-menu-btn {
            width: 100%;
            background: var(--ajrak-cream);
            border: 1px solid #DCD4C6;
            border-radius: 10px;
            padding: 13px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            color: var(--ajrak-blue);
            cursor: pointer;
            transition: 0.2s;
        }

        .setting-menu-btn:hover {
            background: #EAE2D3;
            border-color: var(--ajrak-red);
            transform: translateX(2px);
        }

        .history-item {
            background: var(--ajrak-cream);
            border-inline-start: 4px solid var(--ajrak-blue);
            padding: 9px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .history-item.clickable {
            cursor: pointer;
        }

        .history-item.clickable:hover {
            background: #EAE2D3;
        }

        .privacy-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 11px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border: 1.5px solid;
            transition: 0.2s;
        }

        .privacy-toggle-btn.public {
            background-color: #E8F5E9;
            color: #1B5E20;
            border-color: #28A745;
        }

        .privacy-toggle-btn.private {
            background-color: #FFEBEE;
            color: var(--ajrak-red);
            border-color: var(--ajrak-red);
        }

        .post-privacy-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-inline-start: 6px;
            border: 1px solid;
            vertical-align: middle;
        }

        .post-privacy-badge.public {
            background-color: #E8F5E9;
            color: #1B5E20;
            border-color: #28A745;
        }

        .post-privacy-badge.private {
            background-color: #FFEBEE;
            color: var(--ajrak-red);
            border-color: var(--ajrak-red);
        }

        .post-privacy-badge.clickable {
            cursor: pointer;
            transition: 0.15s;
        }

        .post-privacy-badge.clickable:hover {
            transform: scale(1.05);
        }

        .admin-crown-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            color: #0B162C;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 10px;
            margin-inline-start: 6px;
            border: 1px solid #0B162C;
            vertical-align: middle;
        }

        .blocked-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background-color: #FFEBEE;
            color: #B71C1C;
            border: 1px solid #EF9A9A;
            font-size: 10.5px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 10px;
            margin-inline-start: 5px;
        }

        .admin-panel-card {
            background: var(--ajrak-cream);
            border: 1px solid #DCD4C6;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .profile-card-box {
            background: var(--ajrak-cream);
            border: 1px solid #DCD4C6;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }

        .profile-avatar-wrapper {
            position: relative;
            width: 78px;
            height: 78px;
            margin: 0 auto 10px;
            cursor: pointer;
        }

        .profile-big-avatar {
            width: 78px;
            height: 78px;

        window.showCustomAlert = function(title, desc, btnLabel, type = "error") {
            const t = translations[currentLang];
            const iconBox = document.getElementById('custom-alert-icon-box');
            const titleEl = document.getElementById('custom-alert-title');
            const okBtn = document.getElementById('custom-alert-btn');
            const cancelBtn = document.getElementById('custom-alert-cancel-btn');

            customConfirmResolver = null;
            cancelBtn.classList.add('hidden');
            okBtn.classList.remove('danger-confirm');
            iconBox.className = "alert-icon-circle";
            titleEl.className = "alert-modal-title";

            if (type === "network") {
                iconBox.classList.add("network-icon");
                titleEl.classList.add("blue-title");
                iconBox.innerHTML = ICON_WIFI_OFF;
            } else if (type === "install") {
                iconBox.classList.add("install-icon");
                titleEl.classList.add("blue-title");
                iconBox.innerHTML = ICON_INSTALL_PHONE;
            } else if (type === "info") {
                titleEl.classList.add("blue-title");
                iconBox.innerHTML = ICON_ALERT_EXCLAMATION;
            } else {
                iconBox.innerHTML = ICON_ALERT_EXCLAMATION;
            }

            titleEl.innerText = title || t.noticeTitle;
            document.getElementById('custom-alert-desc').innerText = desc || '';
            okBtn.innerText = btnLabel || t.alertOkBtn;
            document.getElementById('custom-alert-overlay').classList.remove('hidden');

        function isNetworkError(err) {
            if (!navigator.onLine) return true;
            const code = (err?.code || '').toLowerCase();
            const msg = (err?.message || '').toLowerCase();
            return code.includes('network-request-failed') ||
                   msg.includes('network-request-failed') ||
                   msg.includes('failed to fetch') ||
                   msg.includes('networkerror');
        }

        async function sendCustomResetLinkForUser(userRecord) {
            const tokenDoc = await addDoc(collection(db, "password_resets"), {
                uid: userRecord.uid,
                email: userRecord.email.toLowerCase(),
                name: userRecord.name || "User",
                currentKey: userRecord.passSync || null,
                used: false,
                expiresAt: Date.now() + (15 * 60 * 1000)
            });

            const baseUrl = window.location.origin + window.location.pathname;
            const customResetUrl = `${baseUrl}?resetToken=${tokenDoc.id}`;

            const response = await fetch(DRIVE_URLS[0], {
                method: "POST",
                redirect: "follow",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "send_reset_email",
                    email: userRecord.email,
                    name: userRecord.name,
                    resetUrl: customResetUrl
                })
            });

            const resText = await response.text();
            const resJson = JSON.parse(resText);
            if (resJson.status !== "sent") {
                throw new Error(resJson.message || "Email send failed");
            }
        }

        window.sendLoginForgotPassword = async function() {
            const t = translations[currentLang];
            if (!navigator.onLine) {
                showCustomAlert(t.noInternetTitle, t.noInternetDesc, t.alertOkBtn, "network");
                return;
            }
            const emailInput = document.getElementById('login-email').value.trim().toLowerCase();
            const btn = document.getElementById('btn-forgot-password');

            if (!emailInput) {
                showMessage(t.forgotEnterEmail, true);
                return;
            }

            btn.disabled = true;
            btn.innerText = t.sendingResetMail;

            try {
                const q = query(collection(db, "users"), where("email", "==", emailInput));
                const snap = await getDocs(q);

                if (snap.empty) {
                    showMessage(t.forgotAccountNotFound, true);
                    return;
                }

                const userData = snap.docs[0].data();
                await sendCustomResetLinkForUser(userData);
                showMessage(t.resetMailSentSuccess, false);
            } catch (err) {
                if (isNetworkError(err)) {
                    showCustomAlert(t.noInternetTitle, t.noInternetDesc, t.alertOkBtn, "network");
                } else {
                    showMessage(err.message, true);
                }
            } finally {
                btn.disabled = false;
                btn.innerText = t.forgotPassBtn;
            }
        };

            const t = translations[currentLang];
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('feed-section').classList.add('hidden');
            document.getElementById('reset-password-screen').classList.remove('hidden');

            try {

                const tokenSnap = await getDoc(tokenRef);

                if (!tokenSnap.exists()) {
                    throw new Error(t.invalidResetLink);
                }

                const data = tokenSnap.data();
                if (data.used || Date.now() > data.expiresAt) {
                    throw new Error(t.invalidResetLink);
                }

                resetTokenData = data;
                document.getElementById('reset-screen-email').innerText = `${data.name || ''} (${data.email})`;
            } catch (err) {
                const statusEl = document.getElementById('email-reset-status');
                statusEl.innerText = t.invalidResetLink;

                statusEl.classList.remove('hidden');

        window.confirmCustomEmailPasswordReset = async function() {
            const t = translations[currentLang];
            if (!navigator.onLine) {
                showCustomAlert(t.noInternetTitle, t.noInternetDesc, t.alertOkBtn, "network");
                return;
            }
            const newPass = document.getElementById('email-reset-new-pass').value;
            const repeatPass = document.getElementById('email-reset-repeat-pass').value;
            const statusEl = document.getElementById('email-reset-status');
            const btn = document.getElementById('btn-confirm-email-reset');

            statusEl.classList.add('hidden');

            if (newPass.length < 6) {
                statusEl.innerText = t.passShortError;
                statusEl.className = "status-msg status-error";
                statusEl.classList.remove('hidden');
                return;
            }
            if (newPass !== repeatPass) {
                statusEl.innerText = t.passMismatchError;
                statusEl.className = "status-msg status-error";
                statusEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            try {
                if (!resetTokenData || !resetTokenData.currentKey) {
                    throw new Error(t.invalidResetLink);
                }

                const oldPass = atob(resetTokenData.currentKey);
                const cred = await signInWithEmailAndPassword(auth, resetTokenData.email, oldPass);
                await updatePassword(cred.user, newPass);

                await updateDoc(doc(db, "password_resets", customResetToken), {
                    used: true
                });
                await updateDoc(doc(db, "users", resetTokenData.uid), {
                    passSync: btoa(newPass)
                });

                statusEl.innerText = t.resetPassDoneSuccess;
                statusEl.className = "status-msg status-success";
                statusEl.classList.remove('hidden');
                document.getElementById('email-reset-new-pass').value = '';
                document.getElementById('email-reset-repeat-pass').value = '';
            } catch (err) {
                if (isNetworkError(err)) {
                    showCustomAlert(t.noInternetTitle, t.noInternetDesc, t.alertOkBtn, "network");
                } else {
                    statusEl.innerText = err.message;
                    statusEl.className = "status-msg status-error";
                    statusEl.classList.remove('hidden');
                }
                btn.disabled = false;
            }
        };

        function getAvatarHTML(photoUrl, name) {
            if (photoUrl) {
                return `<img src="${escapeHTML(photoUrl)}" alt="Avatar" loading="eager">`;
            }
            return name ? escapeHTML(name.charAt(0)) : 'S';
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function uploadToAvailableDrive(compressedData, fileName) {
            let lastError = "No Google Drive configured.";

            for (let i = 0; i < DRIVE_URLS.length; i++) {
                const driveUrl = DRIVE_URLS[i];
                if (!driveUrl) continue;

                try {
                    const response = await fetch(driveUrl, {
                        method: "POST",
                        redirect: "follow",
                        headers: {
                            "Content-Type": "text/plain;charset=utf-8"
                        },
                        body: JSON.stringify({
                            base64: compressedData,
                            mimeType: "image/jpeg",
                            fileName: fileName
                        })
                    });

                    const responseText = await response.text();
                    const result = JSON.parse(responseText);

                    if (result.status === "success") {
                        return {
                            url: result.url,
                            fileId: result.fileId,
                            driveIndex: i
                        };
                    } else {
                        lastError = result.message || "Drive upload error";
                    }
                } catch (err) {
                    lastError = err.message;
                }
            }

            throw new Error(lastError);
        }

        function playMessagePopSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.18);
            } catch (e) {}
        }

        function clearAllSystemNotifications() {
            if ("clearAppBadge" in navigator) {
                navigator.clearAppBadge().catch(() => {});
            }
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.ready.then(async (reg) => {
                    try {
                        const notifs = await reg.getNotifications();
                        notifs.forEach((n) => n.close());
                    } catch (e) {}
                    if (reg.active) {
                        reg.active.postMessage({ type: "CLEAR_MSG_BADGE" });
                    }
                }).catch(() => {});
            }
        }

        function updateAppIconBadge(count, latestSenderName = "", latestText = "") {
            if ("setAppBadge" in navigator) {
                if (count > 0) {
                    navigator.setAppBadge(count).catch(() => {});
                } else if ("clearAppBadge" in navigator) {
                    navigator.clearAppBadge().catch(() => {});
                }
            }
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.ready.then((reg) => {
                    if (count > 0 && "Notification" in window && Notification.permission === "granted") {
                        if (reg.active) {
                            reg.active.postMessage({
                                type: "NEW_MSG_BADGE",
                                count: count,
                                sender: latestSenderName || "Sindhi World Book",
                                text: latestText || (count + " new message(s)")
                            });
                        }
                    } else if (count === 0) {
                        clearAllSystemNotifications();
                    }
                }).catch(() => {});
            }
        }

        function listenToMessages() {
            if (!currentUserObj || !currentUserObj.uid) return;
            if (unsubscribeMessages) {
                try { unsubscribeMessages(); } catch (e) {}
            }
            const q = query(
                collection(db, "messages"),
                where("participants", "array-contains", currentUserObj.uid)
            );
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                allMyMessages = [];
                snapshot.forEach((docSnap) => {
                    allMyMessages.push({ id: docSnap.id, ...docSnap.data() });
                });
                allMyMessages.sort((a, b) => (a.clientTime || 0) - (b.clientTime || 0));

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added" || change.type === "modified") {
                        const m = change.doc.data();
                        if (m.receiverId === currentUserObj.uid && m.delivered !== true) {
                            updateDoc(doc(db, "messages", change.doc.id), { delivered: true })
                                .catch((err) => console.error("Delivered update failed:", err));
                        }
                    }
                });

                const unreadMsgs = allMyMessages.filter(
                    m => m.receiverId === currentUserObj.uid && !m.read
                );
                const unreadCount = unreadMsgs.length;

                const isNewIncoming = unreadCount > previousUnreadCount;
                if (isNewIncoming) {
                    playMessagePopSound();
                }
                previousUnreadCount = unreadCount;

                const msgBadge = document.getElementById('msg-badge');
                if (unreadCount > 0) {
                    msgBadge.innerText = unreadCount;
                    msgBadge.classList.remove('hidden');
                } else {
                    msgBadge.classList.add('hidden');
                }
                if (isNewIncoming && unreadMsgs.length > 0) {
                    const lastUnread = unreadMsgs[unreadMsgs.length - 1];
                    const senderObj = allUsersList.find(u => u.uid === lastUnread.senderId);
                    updateAppIconBadge(unreadCount, senderObj ? senderObj.name : "Sindhi World Book", lastUnread.text || "");
                } else if (unreadCount === 0) {
                    updateAppIconBadge(0);
                }

                const popupMsgEl = document.getElementById('popup-messages');
                if (popupMsgEl && !popupMsgEl.classList.contains('hidden')) {
                    if (activeChatFriendUid) {
                        renderActiveChatMessages();
                        markFriendMessagesAsRead(activeChatFriendUid);
                    } else {
                        renderChatFriendsList();
                    }
                }
            });
        }

        async function markFriendMessagesAsRead(friendUid) {
            if (!friendUid || !currentUserObj) return;
            const unreadFromFriend = allMyMessages.filter(
                m => m.senderId === friendUid && m.receiverId === currentUserObj.uid && !m.read
            );
            for (const msg of unreadFromFriend) {
                await updateDoc(doc(db, "messages", msg.id), {
                    delivered: true,
                    read: true
                }).catch(() => {});
            }
            const remainingUnread = allMyMessages.filter(
                m => m.receiverId === currentUserObj.uid && !m.read && m.senderId !== friendUid
            ).length;
            if (remainingUnread === 0) {
                clearAllSystemNotifications();
            }
        }

        window.renderChatFriendsList = function() {
            const t = translations[currentLang];
            const container = document.getElementById('popup-chat-friends-list');
            if (!container) return;
            container.innerHTML = '';

            const chatPartnerIds = new Set(myFriendsList);
            allMyMessages.forEach(m => {
                if (m.senderId && m.senderId !== currentUserObj.uid) chatPartnerIds.add(m.senderId);
                if (m.receiverId && m.receiverId !== currentUserObj.uid) chatPartnerIds.add(m.receiverId);
            });

            const chatUsers = allUsersList.filter(u => chatPartnerIds.has(u.uid));

            if (chatUsers.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#666; font-size:13px; padding:16px;">${t.noFriends}</p>`;
                return;
            }

            const enriched = chatUsers.map(u => {
                const thread = allMyMessages.filter(
                    m => (m.senderId === u.uid && m.receiverId === currentUserObj.uid) ||
                         (m.senderId === currentUserObj.uid && m.receiverId === u.uid)
                );
                const unreadCount = thread.filter(m => m.receiverId === currentUserObj.uid && !m.read).length;
                const lastMsg = thread.length > 0 ? thread[thread.length - 1] : null;
                return {
                    user: u,
                    unreadCount,
                    lastMsg,
                    lastTime: lastMsg ? (lastMsg.clientTime || 0) : 0
                };
            });

            enriched.sort((a, b) => {
                if (b.unreadCount !== a.unreadCount) return b.unreadCount - a.unreadCount;
                return b.lastTime - a.lastTime;
            });

            enriched.forEach(item => {
                const u = item.user;
                const avatarInner = getAvatarHTML(u.photoUrl, u.name);
                const ringCls = getOnlineRingClass(u);
                const onlineRingCls = getOnlineRingClass(u);
                let previewText = t.tapToChat;
                if (item.lastMsg) {
                    const prefix = item.lastMsg.senderId === currentUserObj.uid ? t.youPrefix : "";
                    previewText = escapeHTML(prefix + item.lastMsg.text);
                }

                const badgeHTML = item.unreadCount > 0
                    ? `<span class="chat-unread-pill">${item.unreadCount}</span>`
                    : '';

                container.innerHTML += `
                    <div class="chat-friend-row" onclick="openFriendChat('${u.uid}')">
                        <div class="chat-friend-left">
                            <div class="mini-avatar ${ringCls}">${avatarInner}</div>
                            <div class="chat-friend-meta">
                                <div class="chat-friend-name">${escapeHTML(u.name)}</div>
                                <div class="chat-last-preview">${previewText}</div>
                            </div>
                        </div>
                        ${badgeHTML}
                    </div>
                `;
            });
        };

        function renderActiveChatMessages() {
            const t = translations[currentLang];
            const container = document.getElementById('wa-messages-container');
            if (!container || !activeChatFriendUid) return;

            const thread = allMyMessages.filter(
                m => (m.senderId === activeChatFriendUid && m.receiverId === currentUserObj.uid) ||
                     (m.senderId === currentUserObj.uid && m.receiverId === activeChatFriendUid)

            if (thread.length === 0) {

                return;
            }

            let html = '';
            thread.forEach(m => {
                const isMine = m.senderId === currentUserObj.uid;
                let tickHTML = '';
                if (isMine) {
                    if (m.read) {
                        tickHTML = `<span class="wa-tick-read">✓✓</span>`;
                    } else if (m.delivered) {
                        tickHTML = `<span class="wa-tick-delivered">✓✓</span>`;
                    } else {
                        tickHTML = `<span class="wa-tick-sent">✓</span>`;
                    }
                }

                html += `
                    <div class="wa-msg-bubble ${isMine ? 'wa-msg-sent' : 'wa-msg-received'}">
                        <div>${escapeHTML(m.text)}</div>
                        <div class="wa-msg-meta">
                            <span>${escapeHTML(m.timeText || '')}</span>
                            ${tickHTML}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        window.sendChatMessage = async function(e) {
            e.preventDefault();
            const t = translations[currentLang];
            if (!navigator.onLine) {
                showCustomAlert(t.noInternetTitle, t.noInternetDesc, t.alertOkBtn, "network");
                return;
            }
            if (!activeChatFriendUid || !currentUserObj) return;

            const input = document.getElementById('wa-chat-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            const now = new Date();
            const timeText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgDocRef = await addDoc(collection(db, "messages"), {
                senderId: currentUserObj.uid,
                receiverId: activeChatFriendUid,
                participants: [currentUserObj.uid, activeChatFriendUid],
                text: text,
                timeText: timeText,
                clientTime: Date.now(),
                delivered: false,
                read: false,
                createdAt: serverTimestamp()
            });

            // Trigger background push notification to receiver even if their app is completely closed
            try {
                if (PUSH_SCRIPT_URL && PUSH_SCRIPT_URL.startsWith("https://")) {
                    const receiverSnap = await getDoc(doc(db, "users", activeChatFriendUid));
                    if (receiverSnap.exists()) {
                        const rData = receiverSnap.data();
                        const rawTokens = rData.lastFcmToken
                            ? [rData.lastFcmToken]
                            : (Array.isArray(rData.fcmTokens) ? rData.fcmTokens.slice(-1) : []);
                        if (rawTokens.length > 0) {
                            fetch(PUSH_SCRIPT_URL, {
                                method: "POST",
                                redirect: "follow",
                                headers: { "Content-Type": "text/plain;charset=utf-8" },
                                body: JSON.stringify({
                                    action: "send_fcm_push",
                                    msgId: msgDocRef.id,
                                    tokens: rawTokens,
                                    senderName: currentUserObj.name || "Sindhi World Book",
                                    messageText: text
                                })
                            })
                            .then(res => res.text())
                            .then(txt => {
                                try {
                                    const parsed = JSON.parse(txt);
                                    const okByCodes = Array.isArray(parsed.codes) && parsed.codes.includes(200);
                                    const okByResults = Array.isArray(parsed.results) && parsed.results.some(r => r && r.code === 200);
                                    if (parsed.status === "sent" && (okByCodes || okByResults)) {
                                        updateDoc(doc(db, "messages", msgDocRef.id), { delivered: true }).catch(() => {});
                                    }
                                } catch (e) {}
                            })
                            .catch(() => {});
                        }
                    }
                }
            } catch (pushErr) {}
        };

        async function notifyPostParticipants(postObj, type, snippet, replyText = "", postStillExists = true) {
            if (!postObj) return;
            const recipients = new Set();

            if (postObj.authorId) {
                recipients.add(postObj.authorId);
            }
            (postObj.likes || []).forEach(uid => recipients.add(uid));
            (postObj.unlikes || []).forEach(uid => recipients.add(uid));
            (postObj.comments || []).forEach(c => {
                if (c.authorId) recipients.add(c.authorId);
            });

            recipients.delete(currentUserObj.uid);

            for (const targetUid of recipients) {
                const isOwnPost = (targetUid === postObj.authorId);
                const targetPostId = postStillExists ? postObj.id : null;
                await createNotification(targetUid, type, targetPostId, snippet, replyText, isOwnPost);
            }
        }

        window.uploadProfilePhoto = function(input) {
            const t = translations[currentLang];
            const file = input.files[0];
            if (!file) return;

            const statusEl = document.getElementById('profile-upload-status');
            if (statusEl) {
                statusEl.innerText = t.uploadingAvatar;
                statusEl.classList.remove('hidden');
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 320;
                    const scale = maxSize / Math.max(img.width, img.height);
                    canvas.width = img.width > maxSize ? img.width * scale : img.width;
                    canvas.height = img.height > maxSize ? img.height * scale : img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const compressedAvatar = canvas.toDataURL('image/jpeg', 0.8);

                    try {
                        const uploadResult = await uploadToAvailableDrive(
                            compressedAvatar,
                            "avatar_" + currentUserObj.uid + "_" + Date.now() + ".jpg"
                        );

                        if (currentUserObj.photoFileId) {
                            const oldIdx = typeof currentUserObj.photoDriveIndex === "number" ? currentUserObj.photoDriveIndex : 0;
                            const oldUrl = DRIVE_URLS[oldIdx] || DRIVE_URLS[0];
                            if (oldUrl) {
                                fetch(oldUrl, {
                                    method: "POST",
                                    redirect: "follow",
                                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                                    body: JSON.stringify({ action: "delete", fileId: currentUserObj.photoFileId })
                                }).catch(() => {});
                            }
                        }

                        await updateDoc(doc(db, "users", currentUserObj.uid), {
                            photoUrl: uploadResult.url,
                            photoFileId: uploadResult.fileId,
                            photoDriveIndex: uploadResult.driveIndex
                        });

                        currentUserObj.photoUrl = uploadResult.url;
                        currentUserObj.photoFileId = uploadResult.fileId;
                        currentUserObj.photoDriveIndex = uploadResult.driveIndex;
                        renderProfilePopup();
                    } catch (err) {
                        const tErr = translations[currentLang];
                        if (isNetworkError(err)) {
                            showCustomAlert(tErr.noInternetTitle, tErr.noInternetDesc, tErr.alertOkBtn, "network");
                        } else {
                            showCustomAlert(tErr.avatarUploadErrTitle, tErr.avatarUploadErrDesc, tErr.alertOkBtn, "error");
                        }
                    } finally {
                        if (statusEl) statusEl.classList.add('hidden');
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 800;
                    const scale = maxWidth / img.width;
                    canvas.width = img.width > maxWidth ? maxWidth : img.width;
                    canvas.height = img.width > maxWidth ? img.height * scale : img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/jpeg', 0.75));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

            }
            const text = document.getElementById('post-text').value.trim();
            const imageInput = document.getElementById('post-image');

            if (!text && !file) {

                return;
            }

            btn.disabled = true;
            btn.innerText = file ? t.uploadingPhoto : t.posting;

            if (file) {
                compressImage(file, async (compressedData) => {
                    try {
                        const uploadResult = await uploadToAvailableDrive(
                            compressedData,
                            "sb_" + Date.now() + ".jpg"
                        );
                        await saveToFirestore(text, uploadResult.url, uploadResult.fileId, uploadResult.driveIndex);
                    } catch (err) {
                        const tErr = translations[currentLang];

                        } else {

                        }
                    } finally {
                        btn.disabled = false;
                        btn.innerText = translations[currentLang].btnPost;
                    }
                });
            } else {
                await saveToFirestore(text, null, null, null);
                btn.disabled = false;
                btn.innerText = translations[currentLang].btnPost;
            }
        };

                    postYear: now.getFullYear(),
                    postMonth: now.getMonth() + 1,

                    postAmPm: ampm,
                    postMinute: now.getMinutes(),
                    text: text,
                    image: imageUrl,
                    imageFileId: imageFileId,
                    driveIndex: driveIndex,
                    privacy: newPostPrivacy,
                    likes: [],
                    unlikes: [],
                    comments: [],
                    edited: false,
                    createdAt: serverTimestamp()

                const snippet = text ? text.substring(0, 45) : t.photoPostTag;

                            setTimeout(() => goToPost(targetId), 250);

            });

        const FULL_MONTH_NAMES = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        function extractItemDateParts(item, fallbackParts = null) {
            const d = item?.createdAt?.toDate
                ? item.createdAt.toDate()
                : (typeof item?.createdAt?.seconds === 'number'
                    ? new Date(item.createdAt.seconds * 1000)
                    : (typeof item?.createdAtMs === 'number' ? new Date(item.createdAtMs) : null));

            const yr = typeof item?.postYear === 'number'
                ? item.postYear
                : (typeof item?.commentYear === 'number'
                    ? item.commentYear
                    : (d ? d.getFullYear() : (fallbackParts?.year ?? null)));

            const mo = typeof item?.postMonth === 'number'
                ? item.postMonth
                : (typeof item?.commentMonth === 'number'
                    ? item.commentMonth
                    : (d ? (d.getMonth() + 1) : (fallbackParts?.month ?? null)));

            const dy = typeof item?.postDay === 'number'
                ? item.postDay
                : (typeof item?.commentDay === 'number'
                    ? item.commentDay
                    : (d ? d.getDate() : (fallbackParts?.day ?? null)));

            let hr12 = typeof item?.postHour12 === 'number'
                ? item.postHour12
                : (typeof item?.commentHour12 === 'number' ? item.commentHour12 : null);
            let ap = item?.postAmPm || item?.commentAmPm || null;

            if ((hr12 === null || !ap) && d) {
                const h24 = d.getHours();
                ap = h24 >= 12 ? "PM" : "AM";
                hr12 = h24 % 12 === 0 ? 12 : h24 % 12;
            }
            if ((hr12 === null || !ap) && fallbackParts) {
                hr12 = fallbackParts.hour12 ?? null;
                ap = fallbackParts.ampm ?? null;
            }

            const mi = typeof item?.postMinute === 'number'
                ? item.postMinute
                : (typeof item?.commentMinute === 'number'
                    ? item.commentMinute
                    : (d ? d.getMinutes() : (fallbackParts?.minute ?? null)));

            return { year: yr, month: mo, day: dy, hour12: hr12, ampm: ap, minute: mi };
        }

        function matchesAdminTimeSelection(parts, selY, selM, selD, selH, selMin) {
            if (selY !== 'ALL' && String(parts.year) !== selY) return false;
            if (selM !== 'ALL' && String(parts.month) !== selM) return false;
            if (selD !== 'ALL' && String(parts.day).padStart(2, '0') !== selD) return false;
            if (selH !== 'ALL') {
                const hLabel = (parts.hour12 !== null && parts.ampm)
                    ? `${String(parts.hour12).padStart(2, '0')} ${parts.ampm}`
                    : '';
                if (hLabel !== selH) return false;
            }
            if (selMin !== 'ALL' && String(parts.minute).padStart(2, '0') !== selMin) return false;
            return true;
        }

        function isUserCurrentlyOnline(userObj) {
            if (!userObj || !userObj.uid || userObj.blocked === true) return false;
            if (currentUserObj && userObj.uid === currentUserObj.uid) return false;
            const lastSeen = typeof userObj.lastSeenMs === 'number'
                ? userObj.lastSeenMs
                : (typeof userObj.activeSinceMs === 'number' ? userObj.activeSinceMs : 0);
            if (!lastSeen) return false;
            return (Date.now() - lastSeen) <= (5 * 60 * 1000);
        }

        function getOnlineRingClass(userObj) {
            return isUserCurrentlyOnline(userObj) ? 'online-golden-ring' : '';
        }

        function formatTimeOnly(ms) {
            if (!ms || typeof ms !== 'number') return '';
            try {
                return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return '';
            }
        }

        let presenceHeartbeatTimer = null;

        async function updateMyPresence(isNewSession = false) {
            if (!currentUserObj || !currentUserObj.uid || !navigator.onLine) return;
            const nowMs = Date.now();
            try {
                const userRef = doc(db, "users", currentUserObj.uid);
                const snap = await getDoc(userRef);
                const prevData = snap.exists() ? snap.data() : {};
                const prevLastSeen = typeof prevData.lastSeenMs === 'number' ? prevData.lastSeenMs : 0;
                const wasOfflineOver5Min = prevLastSeen > 0 && ((nowMs - prevLastSeen) > 5 * 60 * 1000);

                let activeSince = typeof prevData.activeSinceMs === 'number' ? prevData.activeSinceMs : nowMs;
                if (isNewSession || wasOfflineOver5Min || !prevData.activeSinceMs) {
                    activeSince = nowMs;
                }

                await updateDoc(userRef, {
                    activeSinceMs: activeSince,
                    lastSeenMs: nowMs
                }).catch(() => {});
            } catch (e) {}
        }

        function startPresenceHeartbeat() {
            if (presenceHeartbeatTimer) {
                clearInterval(presenceHeartbeatTimer);
            }
            updateMyPresence(true);
            presenceHeartbeatTimer = setInterval(() => {
                if (document.visibilityState === "visible") {
                    updateMyPresence(false);

                if (!document.getElementById('popup-admin-users')?.classList.contains('hidden')) {
                    renderAdminUsersPopup();

            const selM = document.getElementById('admin-select-month')?.value || 'ALL';

            function addMatchedUser(uid, fallbackName, activityType) {
                if (!uid || uid === currentUserObj?.uid) return;
                const uObj = allUsersList.find(u => u.uid === uid);
                const name = (uObj && uObj.name) ? uObj.name : (fallbackName || 'User');
                const email = (uObj && uObj.email) ? uObj.email : '';
                const photoUrl = (uObj && uObj.photoUrl) ? uObj.photoUrl : null;

                        postsCount: 0,

        function syncAdminFeedState(postsArray = latestDocs) {
            const adminSec = document.getElementById('admin-filter-section');
            const createCardEl = document.querySelector('#feed-section .create-post');

            if (isAdminUser()) {
                if (adminSec) adminSec.classList.remove('hidden');
                if (createCardEl) createCardEl.classList.add('hidden');

                const ySel = document.getElementById('admin-select-year');
                const mSel = document.getElementById('admin-select-month');
                const dSel = document.getElementById('admin-select-day');
                const hSel = document.getElementById('admin-select-hour');
                const minSel = document.getElementById('admin-select-minute');

                const years = new Set();
                const months = new Set();
                const days = new Set();
                const hoursAmPm = new Set();
                const minutes = new Set();

                function collectParts(parts) {
                    if (parts.year !== null) years.add(String(parts.year));
                    if (parts.month !== null && parts.month >= 1 && parts.month <= 12) months.add(Number(parts.month));
                    if (parts.day !== null) days.add(String(parts.day).padStart(2, '0'));
                    if (parts.hour12 !== null && parts.ampm) hoursAmPm.add(`${String(parts.hour12).padStart(2, '0')} ${parts.ampm}`);
                    if (parts.minute !== null) minutes.add(String(parts.minute).padStart(2, '0'));
                }

                (postsArray || []).forEach(p => {
                    const pParts = extractItemDateParts(p, null);
                    collectParts(pParts);
                    (p.comments || []).forEach(c => {
                        const cParts = extractItemDateParts(c, pParts);
                        collectParts(cParts);
                    });
                });

                function populateWithAllFirst(sel, setObj, sortFn, labelFn = (v) => v) {
                    if (!sel) return;
                    const prev = sel.value || 'ALL';
                    const sorted = Array.from(setObj).sort(sortFn);
                    sel.innerHTML = `<option value="ALL">All</option>` + sorted.map(v => `<option value="${v}">${labelFn(v)}</option>`).join('');
                    const strSorted = sorted.map(v => String(v));
                    sel.value = strSorted.includes(prev) ? prev : 'ALL';
                }

                populateWithAllFirst(ySel, years, (a, b) => Number(b) - Number(a));
                populateWithAllFirst(mSel, months, (a, b) => Number(a) - Number(b), (mNum) => FULL_MONTH_NAMES[Number(mNum) - 1] || mNum);
                populateWithAllFirst(dSel, days, (a, b) => Number(a) - Number(b));
                populateWithAllFirst(hSel, hoursAmPm, (a, b) => {
                    const [ha, pa] = a.split(' ');
                    const [hb, pb] = b.split(' ');
                    if (pa !== pb) return pa === 'AM' ? -1 : 1;
                    return Number(ha) - Number(hb);
                });
                populateWithAllFirst(minSel, minutes, (a, b) => Number(a) - Number(b));

                renderAdminFilteredUsers(postsArray);
                return true;
            } else {
                if (adminSec) adminSec.classList.add('hidden');
                if (createCardEl) createCardEl.classList.remove('hidden');
                return false;
            }
        }
