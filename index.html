<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sindhi Book - سنڌي بڪ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14284B">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ajrak-red: #8B1E24;
            --ajrak-dark-red: #5E1116;
            --normal-brown-text: #654321;
            --ajrak-blue: #14284B;
            --ajrak-dark-blue: #0B162C;
            --normal-blue-text: #0056b3;
            --ajrak-cream: #F4EFE6;
            --ajrak-gold: #D4AF37;
            --text-dark: #1A1A1A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ajrak-cream);
            background-image: 
                radial-gradient(circle at 100% 50%, transparent 20%, rgba(139, 30, 36, 0.04) 21%, rgba(139, 30, 36, 0.04) 34%, transparent 35%, transparent),
                radial-gradient(circle at 0% 50%, transparent 20%, rgba(20, 40, 75, 0.04) 21%, rgba(20, 40, 75, 0.04) 34%, transparent 35%, transparent);
            background-size: 40px 40px;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        html[lang="sd"] body,
        html[lang="sd"] input,
        html[lang="sd"] textarea,
        html[lang="sd"] button,
        html[lang="sd"] label {
            font-family: 'Noto Naskh Arabic', 'MB Latif', 'Segoe UI', Tahoma, sans-serif;
        }

        html[lang="sd"] body {
            font-size: 16px;
        }

        .ajrak-border-strip {
            height: 10px;
            width: 100%;
            background-color: var(--ajrak-dark-blue);
            background-image: 
                linear-gradient(45deg, var(--ajrak-red) 25%, transparent 25%), 
                linear-gradient(-45deg, var(--ajrak-red) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--ajrak-cream) 75%),
                linear-gradient(-45deg, transparent 75%, var(--ajrak-cream) 75%);
            background-size: 14px 14px;
            background-position: 0 0, 0 7px, 7px -7px, -7px 0;
            border-top: 2px solid var(--ajrak-gold);
            border-bottom: 2px solid var(--ajrak-gold);
        }

        header {
            background: linear-gradient(135deg, var(--ajrak-blue) 0%, var(--ajrak-dark-blue) 100%);
            color: var(--ajrak-cream);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25);
        }

        .header-top-row {
            padding: 10px 14px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 20px;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        header h1 span {
            color: var(--ajrak-gold);
            font-size: 17px;
        }

        .fb-icon-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-circle-btn {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid var(--ajrak-gold);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-circle-btn:hover, .icon-circle-btn.active {
            background-color: var(--ajrak-red);
            transform: scale(1.05);
        }

        .icon-circle-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: #E41E3F;
            color: white;
            font-size: 10px;
            font-weight: bold;
            min-width: 17px;
            height: 17px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 1.5px solid #FFFFFF;
        }

        .header-bottom-row {
            padding: 4px 14px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .lang-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--ajrak-gold);
            border-radius: 20px;
            padding: 2px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #EAE2D3;
            padding: 3px 10px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .lang-btn.active {
            background-color: var(--ajrak-red);
            color: #FFFFFF;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .logout-btn {
            background-color: var(--ajrak-red);
            border: 1px solid var(--ajrak-gold);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        /* پاپ اپ موڈل */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 22, 44, 0.65);
            z-index: 999;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 65px 12px 20px;
            overflow-y: auto;
        }

        .modal-box {
            background: #FFFFFF;
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            border: 1px solid var(--ajrak-gold);
            overflow: hidden;
            animation: popIn 0.18s ease-out;
        }

        @keyframes popIn {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            background-color: var(--ajrak-cream);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #DCD4C6;
        }

        .modal-header h3 {
            color: var(--ajrak-blue);
            font-size: 16px;
        }

        .modal-close {
            background: var(--ajrak-red);
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-body {
            padding: 14px;
            max-height: 65vh;
            overflow-y: auto;
        }

        .popup-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--ajrak-cream);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            gap: 10px;
            border: 1px solid #E5DEC9;
        }

        .popup-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .mini-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--ajrak-red), var(--ajrak-blue));
            color: white;
            border: 1.5px solid var(--ajrak-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .popup-user-name {
            font-weight: bold;
            color: var(--ajrak-blue);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .popup-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-sm {
            padding: 6px 11px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .btn-sm.primary { background-color: var(--ajrak-blue); color: white; }
        .btn-sm.pending { background-color: #FFF3CD; color: #856404; border: 1px solid #FFEEBA; }
        .btn-sm.danger { background-color: #FFEBEE; color: var(--ajrak-red); border: 1px solid #EF9A9A; }
        .btn-sm.neutral { background-color: #E0D8C8; color: #333; }

        .notif-item {
            background: var(--ajrak-cream);
            border-inline-start: 4px solid var(--ajrak-red);
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.5;
            transition: 0.2s;
        }

        .notif-item.clickable { cursor: pointer; }
        .notif-item.clickable:hover { background: #EAE2D3; transform: translateX(2px); }
        .notif-item.unread { background: #FFF8E7; border-inline-start-color: var(--ajrak-blue); font-weight: 600; }
        .notif-preview-quote { display: block; color: var(--ajrak-blue); font-style: italic; font-size: 12px; margin-top: 2px; }
        .notif-time { display: block; font-size: 11px; color: #777; margin-top: 3px; font-weight: normal; }

        .container {
            max-width: 550px;
            margin: 16px auto;
            padding: 0 12px;
        }

        .card {
            background: #FFFFFF;
            border-radius: 10px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(20, 40, 75, 0.12);
            border: 1px solid rgba(139, 30, 36, 0.2);
            overflow: hidden;
            transition: box-shadow 0.4s ease, border 0.4s ease;
        }

        .card.highlight-post {
            border: 3px solid var(--ajrak-red);
            box-shadow: 0 0 20px rgba(139, 30, 36, 0.45);
        }

        .card-body { padding: 14px; }

        #auth-section { max-width: 420px; margin: 30px auto; text-align: center; }
        #auth-section h2 { color: var(--ajrak-red); margin-bottom: 6px; font-size: 26px; }
        #auth-section p.subtitle { color: var(--ajrak-blue); margin-bottom: 18px; font-size: 14px; }

        .auth-tabs { display: flex; margin-bottom: 16px; border-bottom: 2px solid #EAE2D3; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 15px; font-weight: bold; color: #666; cursor: pointer; }
        .tab-btn.active { color: var(--ajrak-red); border-bottom: 3px solid var(--ajrak-red); }

        input[type="text"], input[type="email"], input[type="password"], textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #C8BEB0;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
            outline: none;
            background-color: #FAF8F5;
        }

        input:focus, textarea:focus { border-color: var(--ajrak-red); background-color: #FFFFFF; }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--ajrak-red) 0%, var(--ajrak-dark-red) 100%);
            color: white;
            border: 1px solid var(--ajrak-gold);
            padding: 11px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .status-msg { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 13px; line-height: 1.6; text-align: start; }
        .status-success { background-color: #E8F5E9; color: #1B5E20; border: 1px solid #A5D6A7; }
        .status-error { background-color: #FFEBEE; color: #B71C1C; border: 1px solid #EF9A9A; }

        /* Create Post */
        .create-post textarea {
            resize: none;
            height: 80px;
            background: var(--ajrak-cream);
            border: 1px solid #DCD4C6;
            margin-bottom: 10px;
            color: var(--normal-brown-text);
            font-weight: 500;
        }
        .post-options { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; }
        .custom-file-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--ajrak-cream);
            color: var(--ajrak-blue);
            border: 1px solid #C8BEB0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #post-image { display: none; }
        .btn-post {
            background-color: var(--ajrak-blue);
            color: white;
            border: 1px solid var(--ajrak-gold);
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-post:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* Posts Feed */
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .author-info { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--ajrak-red), var(--ajrak-blue));
            color: var(--ajrak-cream);
            border: 2px solid var(--ajrak-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .author-name { font-weight: bold; font-size: 15px; color: var(--ajrak-blue); }
        .post-time { font-size: 12px; color: #6E6A63; }

        .owner-controls { display: flex; gap: 8px; }
        .control-btn { color: #666; background: none; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
        .control-btn.edit:hover { color: var(--ajrak-blue); }
        .control-btn.delete:hover { color: var(--ajrak-red); }

        /* پوسٹ کی تحریر کا رنگ: نارمل براؤن */
        .post-content {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--normal-brown-text);
            font-weight: 500;
        }

        .edit-box textarea {
            resize: vertical;
            min-height: 70px;
            background: var(--ajrak-cream);
            margin-bottom: 8px;
            color: var(--normal-brown-text);
        }
        .edit-actions { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 10px; }
        .btn-save { background-color: var(--ajrak-blue); color: white; border: none; padding: 5px 12px; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .btn-cancel { background-color: #E0E0E0; color: #333; border: none; padding: 5px 12px; border-radius: 5px; font-size: 12px; cursor: pointer; }

        .post-image { width: 100%; max-height: 400px; object-fit: cover; border-radius: 6px; margin-bottom: 12px; }

        .post-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--ajrak-blue);
            padding-bottom: 8px;
            border-bottom: 1px solid #EAE2D3;
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #EAE2D3;
        }

        .action-btn {
            background: none;
            border: none;
            color: #555;
            font-weight: bold;
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover { background-color: var(--ajrak-cream); }
        .action-btn.active-like { color: var(--ajrak-red); background-color: rgba(139, 30, 36, 0.08); }
        .action-btn.active-unlike { color: var(--ajrak-blue); background-color: rgba(20, 40, 75, 0.08); }

        .comments-section { margin-top: 10px; }
        .comment-item { background-color: var(--ajrak-cream); border-inline-start: 3px solid var(--ajrak-red); padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
        .comment-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .comment-author { font-weight: bold; color: var(--ajrak-blue); }
        .comment-controls { display: flex; gap: 8px; }
        .comment-controls button { background: none; border: none; font-size: 11px; font-weight: bold; cursor: pointer; color: #666; }

        /* ریپلائی/کمنٹ کی تحریر کا رنگ: نارمل بلیو */
        .comment-body-text {
            color: var(--normal-blue-text);
            font-weight: 500;
            line-height: 1.5;
        }

        .comment-edit-box { margin-top: 6px; }
        .comment-edit-box input {
            padding: 6px 10px;
            font-size: 13px;
            margin-bottom: 6px;
            background: #FFFFFF;
            color: var(--normal-blue-text);
        }

        .comment-form { display: flex; gap: 8px; margin-top: 10px; }
        .comment-form input {
            margin-bottom: 0;
            padding: 8px 12px;
            border-radius: 20px;
            background: var(--ajrak-cream);
            font-size: 13px;
            color: var(--normal-blue-text);
        }
        .comment-form button { background: var(--ajrak-red); color: white; border: none; padding: 0 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; flex-shrink: 0; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="header-top-row">
            <h1><span>❖</span> <span id="header-title">Sindhi Book</span></h1>
            
            <div id="fb-icon-bar" class="fb-icon-bar hidden">
                <!-- 1. My Friends List Icon -->
                <button class="icon-circle-btn" onclick="openPopup('friends')" title="My Friends">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <span id="friends-badge" class="badge-count hidden">0</span>
                </button>

                <!-- 2. Find Friends Icon -->
                <button class="icon-circle-btn" onclick="openPopup('find')" title="Find Friends">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>

                <!-- 3. Friend Requests Icon -->
                <button class="icon-circle-btn" onclick="openPopup('requests')" title="Friend Requests">
                    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    <span id="req-badge" class="badge-count hidden">0</span>
                </button>

                <!-- 4. Notifications Icon -->
                <button class="icon-circle-btn" onclick="openPopup('notifications')" title="Notifications">
                    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                    <span id="notif-badge" class="badge-count hidden">0</span>
                </button>
            </div>
        </div>

        <div class="header-bottom-row">
            <div class="lang-switcher">
                <button id="btn-lang-en" class="lang-btn active" onclick="setLanguage('en')">English</button>
                <button id="btn-lang-sd" class="lang-btn" onclick="setLanguage('sd')">سنڌي</button>
            </div>

            <div id="user-nav" class="user-nav hidden">
                <span id="current-user-display"></span>
                <button id="btn-logout" class="logout-btn" onclick="logoutUser()">Logout</button>
            </div>
        </div>
        <div class="ajrak-border-strip"></div>
    </header>

    <!-- Popup Modal -->
    <div id="popup-overlay" class="modal-overlay hidden" onclick="closePopupOutside(event)">
        <div class="modal-box">
            <div class="ajrak-border-strip"></div>
            <div class="modal-header">
                <h3 id="modal-title">Title</h3>
                <button class="modal-close" onclick="closePopup()">✕</button>
            </div>
            <div class="modal-body">
                <div id="popup-friends" class="hidden">
                    <div id="popup-friends-list"></div>
                </div>

                <div id="popup-find" class="hidden">
                    <input type="text" id="search-friend-input" placeholder="Search by name or email..." oninput="renderFindPopup()">
                    <div id="popup-find-list"></div>
                </div>

                <div id="popup-requests" class="hidden">
                    <div id="popup-requests-list"></div>
                </div>

                <div id="popup-notifications" class="hidden">
                    <div id="popup-notif-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Login & Signup Section -->
    <div id="auth-section" class="card">
        <div class="ajrak-border-strip"></div>
        <div class="card-body">
            <h2 id="auth-title">❖ Sindhi Book ❖</h2>
            <p id="auth-subtitle" class="subtitle">Connect with friends in the traditional colors of Sindh</p>

            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button id="tab-signup" class="tab-btn" onclick="switchTab('signup')">Create Account</button>
            </div>

            <div id="login-form">
                <input type="email" id="login-email" placeholder="Enter your email address" dir="ltr">
                <input type="password" id="login-password" placeholder="Enter your password" dir="ltr">
                <button id="btn-login-submit" class="btn-primary" onclick="loginUser()">Login</button>
            </div>

            if (type === 'friends') {
                document.getElementById('modal-title').innerText = t.modalFriendsTitle;
                document.getElementById('popup-friends').classList.remove('hidden');
                renderFriendsPopup();
            } else if (type === 'find') {
                document.getElementById('modal-title').innerText = t.modalFindTitle;
                document.getElementById('popup-find').classList.remove('hidden');
                renderFindPopup();
            } else if (type === 'requests') {
                document.getElementById('modal-title').innerText = t.modalRequestsTitle;
                document.getElementById('popup-requests').classList.remove('hidden');
                renderRequestsPopup();
            } else if (type === 'notifications') {
                document.getElementById('modal-title').innerText = t.modalNotifTitle;
                document.getElementById('popup-notifications').classList.remove('hidden');
                renderNotificationsPopup();
                myNotifications.forEach(async (n) => {
                    if (!n.read) {
                        await updateDoc(doc(db, "notifications", n.id), { read: true });
                    }
                });
            }
        };

        window.switchTab = function(tab) {
            document.getElementById('auth-message').classList.add('hidden');
            if (tab === 'login') {
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('signup-form').classList.add('hidden');
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-signup').classList.remove('active');
            } else {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('signup-form').classList.remove('hidden');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('tab-signup').classList.add('active');

        function showMessage(text, isError = false) {
            const msgBox = document.getElementById('auth-message');
            msgBox.innerText = text;
            msgBox.className = `status-msg ${isError ? 'status-error' : 'status-success'}`;
            msgBox.classList.remove('hidden');
        }

        window.registerUser = async function() {
            const t = translations[currentLang];
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;

            if (!name || !email || password.length < 6) {
                showMessage(t.msgSignupInvalid, true);
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
                
                await setDoc(doc(db, "users", userCredential.user.uid), {
                    uid: userCredential.user.uid,
                    name: name,
                    email: email.toLowerCase(),
                    friends: [],
                    friendRequests: []
                });

                await sendEmailVerification(userCredential.user);
                await signOut(auth);

                switchTab('login');
                showMessage(t.msgSignupSuccess, false);
            } catch (error) {
                showMessage(error.message, true);
            }
        };

        window.loginUser = async function() {
            const t = translations[currentLang];
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                showMessage(t.msgLoginEmpty, true);
                return;
            }

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                if (!userCredential.user.emailVerified) {
                    await signOut(auth);
                    showMessage(t.msgNotVerified, true);
                }
            } catch (error) {
                showMessage(error.message, true);
            }
        };

        window.logoutUser = async function() {
            if (unsubscribePosts) unsubscribePosts();
            if (unsubscribeUsers) unsubscribeUsers();
            if (unsubscribeMyProfile) unsubscribeMyProfile();
            if (unsubscribeNotifs) unsubscribeNotifs();
            closePopup();
            await signOut(auth);
        };

        onAuthStateChanged(auth, async (user) => {
            if (user && user.emailVerified) {
                const displayName = user.displayName || user.email.split('@')[0];
                currentUserObj = { uid: user.uid, name: displayName };

                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);
                if (!userSnap.exists()) {
                    await setDoc(userDocRef, {
                        uid: user.uid,
                        name: displayName,
                        email: user.email.toLowerCase(),
                        friends: [],
                        friendRequests: []
                    });
                }

                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('feed-section').classList.remove('hidden');
                document.getElementById('user-nav').classList.remove('hidden');
                document.getElementById('fb-icon-bar').classList.remove('hidden');
                document.getElementById('current-user-display').innerText = currentUserObj.name;

                listenToMyProfile();
                listenToAllUsers();
                listenToNotifications();
                listenToPosts();
            } else {
                currentUserObj = null;
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('feed-section').classList.add('hidden');
                document.getElementById('user-nav').classList.add('hidden');
                document.getElementById('fb-icon-bar').classList.add('hidden');
            }
        });

        async function createNotification(toUid, type, postId = null, postSnippet = "", replyText = "", isOwnPost = true) {
            if (!toUid || toUid === currentUserObj.uid) return;
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + " · " + now.toLocaleDateString();
            await addDoc(collection(db, "notifications"), {
                toUid: toUid,
                fromName: currentUserObj.name,
                type: type,
                isOwnPost: isOwnPost,
                postId: postId,
                postSnippet: postSnippet,
                replyText: replyText,
                timeText: timeStr,
                read: false,
                createdAt: serverTimestamp()
            });
        }

        async function notifyPostParticipants(postObj, type, snippet, replyText = "", postStillExists = true) {
            if (!postObj) return;
            const recipients = new Set();

            if (postObj.authorId) {
                recipients.add(postObj.authorId);
            }
            (postObj.likes || []).forEach(uid => recipients.add(uid));
            (postObj.unlikes || []).forEach(uid => recipients.add(uid));
            (postObj.comments || []).forEach(c => {
                if (c.authorId) recipients.add(c.authorId);
            });

            recipients.delete(currentUserObj.uid);

            for (const targetUid of recipients) {
                const isOwnPost = (targetUid === postObj.authorId);
                const targetPostId = postStillExists ? postObj.id : null;
                await createNotification(targetUid, type, targetPostId, snippet, replyText, isOwnPost);
            }
        }

        function listenToMyProfile() {
            unsubscribeMyProfile = onSnapshot(doc(db, "users", currentUserObj.uid), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    myFriendsList = data.friends || [];
                    incomingRequests = data.friendRequests || [];

                    const friendsBadge = document.getElementById('friends-badge');
                    if (myFriendsList.length > 0) {
                        friendsBadge.innerText = myFriendsList.length;
                        friendsBadge.classList.remove('hidden');
                    } else {
                        friendsBadge.classList.add('hidden');
                    }

                    const reqBadge = document.getElementById('req-badge');
                    if (incomingRequests.length > 0) {
                        reqBadge.innerText = incomingRequests.length;
                        reqBadge.classList.remove('hidden');
                    } else {
                        reqBadge.classList.add('hidden');
                    }

                    renderFriendsPopup();
                    renderRequestsPopup();
                    renderFindPopup();
                    renderPostsList(latestDocs);
                }
            });
        }

        function listenToAllUsers() {
            unsubscribeUsers = onSnapshot(collection(db, "users"), (snapshot) => {
                allUsersList = [];
                snapshot.forEach((docSnap) => {
                    if (docSnap.id !== currentUserObj.uid) {
                        allUsersList.push(docSnap.data());
                    }
                });
                renderFriendsPopup();
                renderRequestsPopup();
                renderFindPopup();
            });
        }

        function listenToNotifications() {
            const q = query(collection(db, "notifications"), where("toUid", "==", currentUserObj.uid));
            unsubscribeNotifs = onSnapshot(q, (snapshot) => {
                myNotifications = [];
                snapshot.forEach((docSnap) => {
                    myNotifications.push({ id: docSnap.id, ...docSnap.data() });
                });
                myNotifications.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                const unreadCount = myNotifications.filter(n => !n.read).length;
                const notifBadge = document.getElementById('notif-badge');
                if (unreadCount > 0) {
                    notifBadge.innerText = unreadCount;
                    notifBadge.classList.remove('hidden');
                } else {
                    notifBadge.classList.add('hidden');
                }

                renderNotificationsPopup();
            });
        }

        window.renderFriendsPopup = function() {
            const t = translations[currentLang];
            const container = document.getElementById('popup-friends-list');
            container.innerHTML = '';

            const myFriendsData = allUsersList.filter(u => myFriendsList.includes(u.uid));

            if (myFriendsData.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#666; font-size:13px; padding:12px;">${t.noFriends}</p>`;
                return;
            }

            myFriendsData.forEach(u => {
                const firstLetter = u.name ? u.name.charAt(0) : 'F';
                container.innerHTML += `
                    <div class="popup-list-item">
                        <div class="popup-user-info">
                            <div class="mini-avatar">${firstLetter}</div>
                            <span class="popup-user-name">${u.name}</span>
                        </div>
                        <div class="popup-actions">
                            <button class="btn-sm danger" onclick="unfriendUser('${u.uid}')">${t.unfriendBtn}</button>
                        </div>
                    </div>
                `;
            });
        };

        window.renderFindPopup = function() {
            const t = translations[currentLang];
            const container = document.getElementById('popup-find-list');
            const searchTerm = document.getElementById('search-friend-input').value.trim().toLowerCase();
            container.innerHTML = '';

            if (!searchTerm) {
                container.innerHTML = `<p style="text-align:center; color:#666; font-size:13px; padding:12px;">${t.typeToSearch}</p>`;
                return;
            }

            const filteredUsers = allUsersList.filter(u => {
                const fullName = (u.name || '').toLowerCase().trim();
                const email = (u.email || '').toLowerCase().trim();

                const nameWords = fullName.split(/\s+/);
                const startsWithName = fullName.startsWith(searchTerm) || nameWords.some(word => word.startsWith(searchTerm));

                const emailUserPart = email.split('@')[0] || '';
                const matchesEmail = email === searchTerm || (searchTerm.includes('@') && email.startsWith(searchTerm)) || emailUserPart.startsWith(searchTerm);

                return startsWithName || matchesEmail;
            });

            if (filteredUsers.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#666; font-size:13px; padding:12px;">${t.noUsers}</p>`;
                return;
            }

            filteredUsers.forEach(u => {
                const isFriend = myFriendsList.includes(u.uid);
                const targetRequests = u.friendRequests || [];
                const requestSent = targetRequests.includes(currentUserObj.uid);
                const firstLetter = u.name ? u.name.charAt(0) : 'U';

                let btnHTML = '';
                if (isFriend) {
                    btnHTML = `<button class="btn-sm danger" onclick="unfriendUser('${u.uid}')">${t.unfriendBtn}</button>`;
                } else if (requestSent) {
                    btnHTML = `<button class="btn-sm pending" onclick="sendOrCancelRequest('${u.uid}', true)">${t.requestSent}</button>`;
                } else {
                    btnHTML = `<button class="btn-sm primary" onclick="sendOrCancelRequest('${u.uid}', false)">${t.addFriend}</button>`;
                }

                container.innerHTML += `
                    <div class="popup-list-item">
                        <div class="popup-user-info">
                            <div class="mini-avatar">${firstLetter}</div>
                            <span class="popup-user-name">${u.name}</span>
                        </div>
                        <div class="popup-actions">${btnHTML}</div>
                    </div>
                `;
            });
        };

        window.renderRequestsPopup = function() {
            const t = translations[currentLang];
            const container = document.getElementById('popup-requests-list');
            container.innerHTML = '';

            if (incomingRequests.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#666; font-size:13px; padding:12px;">${t.noRequests}</p>`;
                return;
            }

            incomingRequests.forEach(senderUid => {
                const senderUser = allUsersList.find(u => u.uid === senderUid);
                const senderName = senderUser ? senderUser.name : "User";
                const firstLetter = senderName.charAt(0);

                container.innerHTML += `
                    <div class="popup-list-item">
                        <div class="popup-user-info">
                            <div class="mini-avatar">${firstLetter}</div>
                            <span class="popup-user-name">${senderName}</span>
                        </div>
                        <div class="popup-actions">
                            <button class="btn-sm primary" onclick="acceptRequest('${senderUid}')">${t.acceptBtn}</button>
                            <button class="btn-sm neutral" onclick="declineRequest('${senderUid}')">${t.declineBtn}</button>
                        </div>
                    </div>
                `;
            });
        };

        function renderNotificationsPopup() {
            const t = translations[currentLang];
            const container = document.getElementById('popup-notif-list');
            container.innerHTML = '';

            if (myNotifications.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#666; font-size:13px; padding:12px;">${t.noNotifs}</p>`;
                return;
            }

            myNotifications.forEach(n => {
                let actionMsg = '';
                let previewHTML = '';
                const hasPost = Boolean(n.postId);

                let snippet = n.postSnippet || '';
                if (!snippet && n.postId) {
                    const matchedPost = latestDocs.find(p => p.id === n.postId);
                    if (matchedPost) {
                        snippet = matchedPost.text ? matchedPost.text.substring(0, 45) : t.photoPostTag;
                    }
                }

                const own = (n.isOwnPost !== false);

                if (n.type === 'like') {
                    const label = own ? t.notifLikeOwn : t.notifLike;
                    actionMsg = `${label}${snippet ? ':' : '.'}`;
                    if (snippet) previewHTML = `<span class="notif-preview-quote">"${snippet}..."</span>`;
                } else if (n.type === 'unlike') {
                    const label = own ? t.notifUnlikeOwn : t.notifUnlike;
                    actionMsg = `${label}${snippet ? ':' : '.'}`;
                    if (snippet) previewHTML = `<span class="notif-preview-quote">"${snippet}..."</span>`;
                } else if (n.type === 'comment') {
                    const label = own ? t.notifCommentOwn : t.notifComment;
                    actionMsg = `${label}: "${n.replyText || n.extraText || ''}"`;
                    if (snippet) previewHTML = `<span class="notif-preview-quote">(${snippet}...)</span>`;
                } else if (n.type === 'delete_comment') {
                    const label = own ? t.notifDeleteCommentOwn : t.notifDeleteComment;
                    actionMsg = `${label}: "${n.replyText || ''}"`;
                    if (snippet) previewHTML = `<span class="notif-preview-quote">(${snippet}...)</span>`;
                } else if (n.type === 'delete_post') {
                    actionMsg = `${t.notifDeletePost}${snippet ? ':' : '.'}`;
                    if (snippet) previewHTML = `<span class="notif-preview-quote">"${snippet}..."</span>`;
                } else if (n.type === 'accept') {
                    actionMsg = t.notifAccept;
                }

                const clickAttr = hasPost ? `onclick="goToPost('${n.postId}')"` : '';

                container.innerHTML += `
                    <div class="notif-item ${!n.read ? 'unread' : ''} ${hasPost ? 'clickable' : ''}" ${clickAttr}>
                        <strong>${n.fromName}</strong> ${actionMsg}
                        ${previewHTML}
                        <span class="notif-time">${n.timeText || ''}</span>
                    </div>
                `;
            });
        }

        window.sendOrCancelRequest = async function(targetUid, alreadySent) {
            const targetRef = doc(db, "users", targetUid);
            if (alreadySent) {
                await updateDoc(targetRef, { friendRequests: arrayRemove(currentUserObj.uid) });
            } else {
                await updateDoc(targetRef, { friendRequests: arrayUnion(currentUserObj.uid) });
            }
        };

        window.acceptRequest = async function(senderUid) {
            const myRef = doc(db, "users", currentUserObj.uid);
            const senderRef = doc(db, "users", senderUid);

            await updateDoc(myRef, {
                friendRequests: arrayRemove(senderUid),
                friends: arrayUnion(senderUid)
            });
            await updateDoc(senderRef, {
                friends: arrayUnion(currentUserObj.uid)
            });

            await createNotification(senderUid, 'accept');
        };

        window.declineRequest = async function(senderUid) {
            await updateDoc(doc(db, "users", currentUserObj.uid), {
                friendRequests: arrayRemove(senderUid)
            });
        };

        window.unfriendUser = async function(targetUid) {
            const t = translations[currentLang];
            if (!confirm(t.confirmUnfriend)) return;

            await updateDoc(doc(db, "users", currentUserObj.uid), { friends: arrayRemove(targetUid) });
            await updateDoc(doc(db, "users", targetUid), { friends: arrayRemove(currentUserObj.uid) });
        };

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 800;
                    const scale = maxWidth / img.width;
                    canvas.width = img.width > maxWidth ? maxWidth : img.width;
                    canvas.height = img.width > maxWidth ? img.height * scale : img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/jpeg', 0.75));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.createPost = async function() {
            const t = translations[currentLang];
            const text = document.getElementById('post-text').value.trim();
            const imageInput = document.getElementById('post-image');
            const file = imageInput.files[0];
            const btn = document.getElementById('post-submit-btn');

            if (!text && !file) {
                alert(t.alertEmptyPost);
                return;
            }

            btn.disabled = true;
            btn.innerText = file ? t.uploadingPhoto : t.posting;

            if (file) {
                compressImage(file, async (compressedData) => {
                    try {
                        const response = await fetch(DRIVE_UPLOAD_URL, {
                            method: "POST",
                            body: JSON.stringify({
                                base64: compressedData,
                                mimeType: "image/jpeg",
                                fileName: "sb_" + Date.now() + ".jpg"
                            })
                        });

                        const result = await response.json();

                        if (result.status === "success") {
                            await saveToFirestore(text, result.url, result.fileId);
                        } else {
                            alert("Google Drive Upload Error: " + result.message);
                        }
                    } catch (err) {
                        alert("Upload Failed: " + err.message);
                    } finally {
                        btn.disabled = false;
                        btn.innerText = translations[currentLang].btnPost;
                    }
                });
            } else {
                await saveToFirestore(text, null, null);
                btn.disabled = false;
                btn.innerText = translations[currentLang].btnPost;
            }
        };

        async function saveToFirestore(text, imageUrl, imageFileId = null) {
            try {
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + " · " + now.toLocaleDateString();

                await addDoc(collection(db, "posts"), {
                    authorId: currentUserObj.uid,
                    authorName: currentUserObj.name,
                    timeText: timeString,
                    text: text,
                    image: imageUrl,
                    imageFileId: imageFileId,
                    likes: [],
                    unlikes: [],
                    comments: [],
                    edited: false,
                    createdAt: serverTimestamp()
                });

                document.getElementById('post-text').value = '';
                document.getElementById('post-image').value = '';
                updatePhotoLabel();
            } catch (error) {
                alert(error.message);
            }
        }

        window.enableEdit = function(postId) {
            document.getElementById(`post-text-display-${postId}`).classList.add('hidden');
            document.getElementById(`edit-box-${postId}`).classList.remove('hidden');
        };

        window.cancelEdit = function(postId) {
            document.getElementById(`post-text-display-${postId}`).classList.remove('hidden');
            document.getElementById(`edit-box-${postId}`).classList.add('hidden');
        };

        window.saveEdit = async function(postId) {
            const t = translations[currentLang];
            const newText = document.getElementById(`edit-input-${postId}`).value.trim();
            if (!newText) {
                alert(t.alertEmptyEdit);
                return;
            }
            await updateDoc(doc(db, "posts", postId), { text: newText, edited: true });
        };

        window.enableCommentEdit = function(postId, commentIndex) {
            document.getElementById(`comment-text-${postId}-${commentIndex}`).classList.add('hidden');
            document.getElementById(`comment-edit-${postId}-${commentIndex}`).classList.remove('hidden');
        };

        window.cancelCommentEdit = function(postId, commentIndex) {
            document.getElementById(`comment-text-${postId}-${commentIndex}`).classList.remove('hidden');
            document.getElementById(`comment-edit-${postId}-${commentIndex}`).classList.add('hidden');
        };

        window.saveCommentEdit = async function(postId, commentIndex) {
            const t = translations[currentLang];
            const newText = document.getElementById(`comment-input-edit-${postId}-${commentIndex}`).value.trim();
            if (!newText) {
                alert(t.alertEmptyEdit);
                return;
            }
            const postObj = latestDocs.find(p => p.id === postId);
            if (!postObj) return;

            const updatedComments = [...(postObj.comments || [])];
            updatedComments[commentIndex] = {
                ...updatedComments[commentIndex],
                text: newText,
                edited: true
            };

            await updateDoc(doc(db, "posts", postId), { comments: updatedComments });
        };

        window.deleteComment = async function(postId, commentIndex) {
            const t = translations[currentLang];
            if (!confirm(t.confirmDeleteComment)) return;

            const postObj = latestDocs.find(p => p.id === postId);
            if (!postObj) return;

            const deletedComment = (postObj.comments || [])[commentIndex];
            const deletedReplyInfo = deletedComment ? `${deletedComment.author}: ${deletedComment.text}` : "";
            const snippet = postObj.text ? postObj.text.substring(0, 45) : t.photoPostTag;

            const updatedComments = (postObj.comments || []).filter((_, idx) => idx !== commentIndex);
            await updateDoc(doc(db, "posts", postId), { comments: updatedComments });

            await notifyPostParticipants(postObj, 'delete_comment', snippet, deletedReplyInfo, true);
        };

        window.deletePost = async function(postId) {
            const t = translations[currentLang];
            if (!confirm(t.confirmDelete)) return;

            const postObj = latestDocs.find(p => p.id === postId);
            if (postObj) {
                const snippet = postObj.text ? postObj.text.substring(0, 45) : t.photoPostTag;
                await notifyPostParticipants(postObj, 'delete_post', snippet, "", false);

                // Google Drive se bhi tasveer trash/delete karein agar fileId mojood ho
                if (postObj.imageFileId) {
                    fetch(DRIVE_UPLOAD_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "delete",
                            fileId: postObj.imageFileId
                        })
                    }).catch(() => {});
                }
            }

            await deleteDoc(doc(db, "posts", postId));
        };

        function listenToPosts() {
            const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
            unsubscribePosts = onSnapshot(q, (snapshot) => {
                latestDocs = [];
                snapshot.forEach((docSnap) => {
                    latestDocs.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderPostsList(latestDocs);
                renderNotificationsPopup();
            });
        }

        function renderPostsList(postsArray) {
            const t = translations[currentLang];
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            const visiblePosts = postsArray.filter(post => 
                post.authorId === currentUserObj.uid || myFriendsList.includes(post.authorId)
            );

            if (visiblePosts.length === 0) {
                container.innerHTML = `<div class="card"><div class="card-body" style="text-align:center; color:#666;">${t.emptyFeed}</div></div>`;
                return;
            }

            visiblePosts.forEach((post) => {
                const postId = post.id;
                const likes = post.likes || [];
                const unlikes = post.unlikes || [];
                const comments = post.comments || [];
                const isLiked = likes.includes(currentUserObj.uid);
                const isUnliked = unlikes.includes(currentUserObj.uid);
                const firstLetter = post.authorName ? post.authorName.charAt(0) : 'S';
                const isPostOwner = post.authorId === currentUserObj.uid;

                let commentsHTML = '';
                comments.forEach((c, idx) => {
                    const isCommentOwner = c.authorId === currentUserObj.uid;
                    const canDeleteComment = isCommentOwner || isPostOwner;

                    commentsHTML += `
                        <div class="comment-item">
                            <div class="comment-top">
                                <span class="comment-author">${c.author} <small style="font-weight:normal; color:#777;">${c.edited ? t.edited : ''}</small></span>
                                ${(isCommentOwner || canDeleteComment) ? `
                                    <div class="comment-controls">
                                        ${isCommentOwner ? `<button class="edit" onclick="enableCommentEdit('${postId}', ${idx})">${t.edit}</button>` : ''}
                                        ${canDeleteComment ? `<button class="delete" onclick="deleteComment('${postId}', ${idx})">${t.delete}</button>` : ''}
                                    </div>
                                ` : ''}
                            </div>
                            <div id="comment-text-${postId}-${idx}" class="comment-body-text">${c.text}</div>
                            ${isCommentOwner ? `
                                <div id="comment-edit-${postId}-${idx}" class="comment-edit-box hidden">
                                    <input type="text" id="comment-input-edit-${postId}-${idx}" value="${c.text.replace(/"/g, '&quot;')}">
                                    <div style="display:flex; gap:6px; justify-content:flex-end;">
                                        <button class="btn-cancel" onclick="cancelCommentEdit('${postId}', ${idx})">${t.cancel}</button>
                                        <button class="btn-save" onclick="saveCommentEdit('${postId}', ${idx})">${t.saveChanges}</button>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div id="post-card-${postId}" class="card">
                        <div class="ajrak-border-strip"></div>
                        <div class="card-body">
                            <div class="post-header">
                                <div class="author-info">
                                    <div class="avatar">${firstLetter}</div>
                                    <div>
                                        <div class="author-name">${post.authorName}</div>
                                        <div class="post-time">${post.timeText || ''} ${post.edited ? t.edited : ''}</div>
                                    </div>
                                </div>
                                ${isPostOwner ? `
                                    <div class="owner-controls">
                                        <button class="control-btn edit" onclick="enableEdit('${postId}')">${t.edit}</button>
                                        <button class="control-btn delete" onclick="deletePost('${postId}')">${t.delete}</button>
                                    </div>
                                ` : ''}
                            </div>
                            
                            <div id="post-text-display-${postId}" class="post-content ${!post.text ? 'hidden' : ''}">${post.text || ''}</div>
                            
                            ${isPostOwner ? `
                                <div id="edit-box-${postId}" class="edit-box hidden">
                                    <textarea id="edit-input-${postId}">${post.text || ''}</textarea>
                                    <div class="edit-actions">
                                        <button class="btn-cancel" onclick="cancelEdit('${postId}')">${t.cancel}</button>
                                        <button class="btn-save" onclick="saveEdit('${postId}')">${t.saveChanges}</button>
                                    </div>
                                </div>
                            ` : ''}

                            ${post.image ? `<img src="${post.image}" class="post-image" alt="Post Image" loading="lazy">` : ''}

                            <div class="post-stats">
                                <span>❤️ ${likes.length} ${t.likesCount}</span>
                                <span>💔 ${unlikes.length} ${t.unlikesCount}</span>
                                <span>${comments.length} ${t.commentsCount}</span>
                            </div>

                            <div class="post-actions">
                                <button class="action-btn ${isLiked ? 'active-like' : ''}" onclick="handleLike('${postId}', ${isLiked})">
                                    ${t.likeBtn}
                                </button>
                                <button class="action-btn ${isUnliked ? 'active-unlike' : ''}" onclick="handleUnlike('${postId}', ${isUnliked})">
                                    ${t.unlikeBtn}
                                </button>
                                <div style="width: 70px;"></div>
                            </div>

                            <div class="comments-section">
                                ${commentsHTML}
                                <form class="comment-form" onsubmit="addComment(event, '${postId}')">
                                    <input type="text" id="comment-input-${postId}" placeholder="${t.commentPlaceholder}">
                                    <button type="submit">${t.sendBtn}</button>
                                </form>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.handleLike = async function(postId, isLiked) {
            const t = translations[currentLang];
            const postRef = doc(db, "posts", postId);
            if (isLiked) {
                await updateDoc(postRef, { likes: arrayRemove(currentUserObj.uid) });
            } else {
                await updateDoc(postRef, {
                    likes: arrayUnion(currentUserObj.uid),
                    unlikes: arrayRemove(currentUserObj.uid)
                });
                const targetPost = latestDocs.find(p => p.id === postId);
                if (targetPost) {
                    const snippet = targetPost.text ? targetPost.text.substring(0, 45) : t.photoPostTag;
                    await notifyPostParticipants(targetPost, 'like', snippet, "", true);
                }
            }
        };

        window.handleUnlike = async function(postId, isUnliked) {
            const t = translations[currentLang];
            const postRef = doc(db, "posts", postId);
            if (isUnliked) {
                await updateDoc(postRef, { unlikes: arrayRemove(currentUserObj.uid) });
            } else {
                await updateDoc(postRef, {
                    unlikes: arrayUnion(currentUserObj.uid),
                    likes: arrayRemove(currentUserObj.uid)
                });
                const targetPost = latestDocs.find(p => p.id === postId);
                if (targetPost) {
                    const snippet = targetPost.text ? targetPost.text.substring(0, 45) : t.photoPostTag;
                    await notifyPostParticipants(targetPost, 'unlike', snippet, "", true);
                }
            }
        };

        window.addComment = async function(event, postId) {
            event.preventDefault();
            const t = translations[currentLang];
            const input = document.getElementById(`comment-input-${postId}`);
            const commentText = input.value.trim();
            if (!commentText) return;

            const postRef = doc(db, "posts", postId);
            await updateDoc(postRef, {
                comments: arrayUnion({
                    authorId: currentUserObj.uid,
                    author: currentUserObj.name,
                    text: commentText,
                    edited: false
                })
            });

            const targetPost = latestDocs.find(p => p.id === postId);
            if (targetPost) {
                const snippet = targetPost.text ? targetPost.text.substring(0, 45) : t.photoPostTag;
                await notifyPostParticipants(targetPost, 'comment', snippet, commentText, true);
            }
        };

        setLanguage(currentLang);
    </script>

                });
